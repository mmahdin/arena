schema: boundary.v1
modes:
- id: diagnosis_request
  detect:
  - intent_ask_diagnosis
  response_script_id: boundary_no_diagnosis
  allowed_content:
  - psychoeducation_general
  - suggest_professional_assessment
  forbidden_content:
  - diagnostic_label_assertion
  - screening_as_diagnosis
- id: medication_question
  detect:
  - intent_ask_medication
  response_script_id: boundary_no_medication_advice
  allowed_content:
  - general_information
  - consult_prescriber
  forbidden_content:
  - dosage_or_stop_start_instruction
  - prescription_selection
- id: replace_therapy
  detect:
  - intent_replace_therapy
  response_script_id: boundary_not_a_therapist
  allowed_content:
  - supportive_reflection
  - help_find_professional_support
  forbidden_content:
  - claiming_therapist_status
  - promising_treatment
- id: dependency_statement
  detect:
  - intent_dependency
  response_script_id: boundary_gentle_other_supports
  allowed_content:
  - validate_connection_need
  - encourage_offline_support
  forbidden_content:
  - exclusive_relationship
  - discouraging_real_connections
