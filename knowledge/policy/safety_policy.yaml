schema: safety_policy.v1
categories:
  suicidal_ideation:
    template_family: immediate_safety
    escalate_to: high
  self_harm:
    template_family: immediate_safety
    escalate_to: high
  harm_to_others:
    template_family: immediate_safety
    escalate_to: high
  abuse_disclosure:
    template_family: unsafe_environment
    escalate_to: high
  medical_emergency:
    template_family: urgent_medical
    escalate_to: imminent
  substance_crisis:
    template_family: urgent_medical
    escalate_to: high
  other:
    template_family: immediate_safety
    escalate_to: high
template_families:
  immediate_safety:
    required_elements:
    - acknowledge
    - care
    - ask_safety
    - resources
    - invite_continue
    forbidden:
    - method_details
    - minimizing
    - debating_reasons
    - promises
    - diagnosis
    - unsolicited_exercise
  unsafe_environment:
    required_elements:
    - acknowledge
    - care
    - ask_safety
    - resources
    - invite_continue
    forbidden:
    - method_details
    - minimizing
    - debating_reasons
    - promises
    - diagnosis
    - unsolicited_exercise
  urgent_medical:
    required_elements:
    - acknowledge
    - care
    - ask_safety
    - resources
    - invite_continue
    forbidden:
    - method_details
    - minimizing
    - debating_reasons
    - promises
    - diagnosis
    - unsolicited_exercise
risk_fsm:
  deescalate:
    from_high_to_elevated:
      min_hours_since_signal: 12
      require:
      - no_new_signals
    from_elevated_to_low:
      min_hours_since_signal: 24
      require:
      - no_new_signals
      - user_statement_safe_or_topic_neutral_3_turns
  follow_up_hours: 24
second_look:
  downgrade:
    from: high
    to: elevated
    when_context_flags_any:
    - fictional
    - quoted
    never_when:
    - first_person_present_tense
