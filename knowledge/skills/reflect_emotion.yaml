schema: skillcard.v1
id: reflect_emotion
name: Reflect the named feeling
category: listening
descriptor: Mirror the user's expressed feeling and its context without guessing causes.
purpose: Convey accurate understanding before advice.
use_when:
- emotion_high
- disclosure_unprocessed
do_not_use_when:
- risk_high
compatible_with:
- validate_experience
- summarize_thread
conflicts_with:
- psychoeducation_simple
form:
  max_sentences: 4
  may_end_with_question: true
  avoid:
  - advice
  - assumed_motive
card_text: Name one plausible feeling in tentative everyday words and link it to the concrete event
  the user gave. Avoid diagnosing, exaggerating or claiming certainty. If unsure, use a soft check
  rather than filling gaps. Let their correction stand; do not end with a compulsory question.
examples:
  good:
  - user: My manager dismissed my work in front of everyone.
    reply: Being dismissed publicly after that work sounds hurtful and frustrating.
  poor:
  - user: My manager dismissed my work in front of everyone.
    reply: You are clearly traumatized by your manager.
    why: Adds a diagnosis and assumes intensity the user did not state.
evidence:
- ref: SAMHSA TIP 35 (2019), reflective listening
  note: Approach-level basis; wording is an unreviewed adaptation for AI conversation.
locales: {}
