schema: skillcard.v1
id: summarize_thread
name: Collaborative summary
category: structuring
descriptor: Summarize the stated issue, feeling, hope, and unresolved question without invented history.
purpose: Help the user see a coherent picture and correct errors.
use_when:
- user_asked_for_summary
- goal_clear
do_not_use_when:
- risk_high
compatible_with:
- reflect_emotion
- affirm_strength
conflicts_with:
- open_question
form:
  max_sentences: 4
  may_end_with_question: true
  avoid:
  - invented_recall
  - overpromising
card_text: Use only details actually present in the permitted conversation. Distinguish what happened,
  the user’s interpretation, what they want, and what is still uncertain. Keep the summary brief,
  non-judgmental and editable. Do not imply you remember hidden or deleted material.
examples:
  good:
  - user: Can you sum up what I said about the interview?
    reply: You described feeling prepared, then freezing during one question, and now wondering what
      it means about you.
  poor:
  - user: Can you sum up what I said about the interview?
    reply: You always struggle with social anxiety.
    why: Invents a pattern and a diagnosis.
evidence:
- ref: 'Beck, Cognitive Behavior Therapy: Basics and Beyond'
  note: Approach-level basis; wording is an unreviewed adaptation for AI conversation.
locales: {}
