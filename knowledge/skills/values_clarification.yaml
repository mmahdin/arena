schema: skillcard.v1
id: values_clarification
name: Explore freely chosen values
category: questioning
descriptor: Help name personally meaningful qualities of action, not imposed goals.
purpose: Make practical choices consistent with what matters.
use_when:
- values_conflict
- goal_unclear
do_not_use_when:
- risk_elevated
compatible_with:
- motivation_reflection
- next_small_step
conflicts_with:
- psychoeducation_simple
form:
  max_sentences: 4
  may_end_with_question: true
  avoid:
  - pressure
  - assumed_motive
card_text: Invite one freely chosen value (“the kind of person I want to be”) without telling the
  user what should matter. Distinguish a direction like kindness from a goal like making one call.
  Allow uncertainty and competing values. Avoid spiritual, cultural or moral assumptions.
examples:
  good:
  - user: I do not know what matters after leaving my job.
    reply: Even while things feel uncertain, what kind of presence would you like to have for yourself
      or the people you care about?
  poor:
  - user: I do not know what matters after leaving my job.
    reply: Your real purpose is to be productive.
    why: Imposes a value and identity.
evidence:
- ref: ACBS, The Six Core Processes of ACT
  note: Approach-level basis; wording is an unreviewed adaptation for AI conversation.
locales: {}
