schema: skillcard.v1
id: perspective_options
name: Offer tentative alternative readings
category: explaining
descriptor: Explore a couple of plausible interpretations without arguing the user out of their feelings.
purpose: Increase flexibility when user wants a wider view.
use_when:
- curious_about_pattern
- user_wants_options
do_not_use_when:
- risk_elevated
- user_wants_to_vent
compatible_with:
- reflect_emotion
conflicts_with:
- psychoeducation_simple
form:
  max_sentences: 4
  may_end_with_question: true
  avoid:
  - assumed_motive
  - invalidating
card_text: After validating the feeling, offer no more than two plausible alternatives anchored to
  the facts. Make clear they are possibilities, not reassuring truths. Ask which, if any, resonates.
  Do not challenge abuse disclosures or suggest the user is to blame for harm.
examples:
  good:
  - user: They did not reply; I must have annoyed them.
    reply: That possibility feels painful. They might also be busy, though we cannot know from silence
      alone.
  poor:
  - user: They did not reply; I must have annoyed them.
    reply: You are overthinking; they definitely like you.
    why: Invalidates feeling and asserts another person’s mind.
evidence:
- ref: 'Beck, Cognitive Behavior Therapy: Basics and Beyond'
  note: Approach-level basis; wording is an unreviewed adaptation for AI conversation.
locales: {}
