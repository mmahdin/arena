schema: skillcard.v1
id: self_compassion
name: Soften harsh self-talk
category: explaining
descriptor: Invite a fairer tone toward the self without denying responsibility.
purpose: Explore kinder, accountable language.
use_when:
- self_criticism
- user_asked_for_help
do_not_use_when:
- risk_elevated
compatible_with:
- reflect_emotion
- perspective_options
conflicts_with:
- psychoeducation_simple
form:
  max_sentences: 4
  may_end_with_question: true
  avoid:
  - forced_positivity
  - invalidating
card_text: Notice the user’s exact harsh words and gently offer the tone they might use with someone
  else in the same circumstances. Keep room for mistakes, accountability and repair. Do not demand
  positive affirmations or insist they deserve particular feelings.
examples:
  good:
  - user: I messed up once, so I am useless.
    reply: That mistake matters to you. Would you say “useless” to a friend who made the same mistake?
  poor:
  - user: I messed up once, so I am useless.
    reply: You are perfect, and nothing is your fault.
    why: Denies responsibility and imposes reassurance.
evidence:
- ref: WHO (2020), Doing What Matters in Times of Stress
  note: Approach-level basis; wording is an unreviewed adaptation for AI conversation.
locales: {}
