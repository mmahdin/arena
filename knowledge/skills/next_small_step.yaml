schema: skillcard.v1
id: next_small_step
name: Co-design one small step
category: structuring
descriptor: Offer an achievable, reversible action matched to readiness and energy.
purpose: Help the user try an action without pressure.
use_when:
- goal_clear
- readiness_medium
- readiness_high
do_not_use_when:
- risk_high
- action_barrier
compatible_with:
- affirm_strength
- ask_permission
conflicts_with:
- motivation_reflection
form:
  max_sentences: 4
  may_end_with_question: true
  avoid:
  - pressure
  - overpromising
card_text: Ask permission before proposing a concrete low-stakes step. Let the user choose its size,
  time and backup plan. Prefer actions feasible even with low energy; success means learning, not
  a guaranteed mood change. Do not prescribe exposure or safety-risk actions.
examples:
  good:
  - user: I want to reconnect but have no energy.
    reply: Would sending one short hello to someone safe feel manageable, or is resting more fitting
      today?
  poor:
  - user: I want to reconnect but have no energy.
    reply: Call everyone you know by tonight.
    why: Overwhelming, directive and not collaborative.
evidence:
- ref: NICE NG222, behavioral activation principles
  note: Approach-level basis; wording is an unreviewed adaptation for AI conversation.
locales: {}
