# Theia Psychology Knowledge v0.1.0 - unreviewed development draft; never activate for real users.
name: theia-kb
version: 0.1.0
requires_core: '>=1.0.0 <2.0.0'
emits_schemas:
  unified: unified_turn.v2
  background: background_intelligence.v2
  memory_writer: memwriter.v1
  reflection: reflection.v1
  safety_l1: safety.v1
knowledge_language: en
conversation_languages: [en, fa]
