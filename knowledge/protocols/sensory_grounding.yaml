schema: protocol.v1
id: sensory_grounding
version: 0.1.0
name: Brief eyes-open orientation
family: grounding
one_liner: Gently notice neutral things in the room while staying free to stop.
est_minutes: 3
evidence:
- ref: WHO (2020), Doing What Matters in Times of Stress
  level: standard_practice
fit_tags:
- overwhelm
- stress
- anxiety_social
eligibility:
  require_phase: []
  require_slots_filled: []
  require_risk_at_most: low
  min_user_readiness: low
  forbid_flags:
  - psychosis_signs
  - mania_signs
  - dissociation
  - intoxication
  - unsafe_environment
  - medical_instability
  - coercion_present
  decline_cooldown_days: 0
  min_days_between_runs: 0
  max_runs_per_thread: 0
steps:
- id: choose
  goal: Choose an acceptable anchor
  instruction: Ask for permission and whether eyes-open noticing of the room sounds okay. Avoid if
    surroundings feel unsafe.
  expected_inputs:
  - anchor
  success_criteria: sensory_noticing_completed
  ui:
    widget: none
  on_success: orient
  on_stuck:
    adapt: anchor_easier
    after: 1
    then: pause
  on_distress: stop
  on_decline: stop
  adaptations:
  - id: anchor_easier
    instruction: Allow attention to a neutral fixed object instead of the body.
- id: orient
  goal: Name a few neutral present details
  instruction: Invite sight, sound or texture at a gentle pace. Do not demand a fixed five-senses
    count or closed-eye breathing.
  expected_inputs:
  - sensory_observation
  success_criteria: sensory_noticing_completed
  ui:
    widget: none
  on_success: check
  on_stuck:
    adapt: orient_easier
    after: 1
    then: pause
  on_distress: stop
  on_decline: stop
  adaptations:
  - id: orient_easier
    instruction: Notice only one object; invite stopping immediately.
- id: check
  goal: Check whether to continue or stop
  instruction: Ask whether noticing felt steady, unchanged or worse; pause if discomfort rose.
  expected_inputs:
  - grounding_feedback
  success_criteria: grounding_effect_checked
  ui:
    widget: none
  on_success: complete
  on_stuck:
    adapt: ''
    after: 0
    then: pause
  on_distress: stop
  on_decline: stop
  adaptations: []
offer:
  why_templates:
  - overwhelm_tool
  intents:
  - Explain the purpose briefly when it helps the user's choice.
  - Keep participation voluntary; accept skipping, pausing or changing direction.
stop_rules:
- when: risk_at_least_elevated
  action: stop
  note: safety_overrides_exercise
- when: user_declines
  action: stop
  note: respect_refusal
- when: distress_increases
  action: stop
  note: return_to_support
- when: topic_shift_later
  action: pause
  note: respect_topic_shift
  follow_up_days: 2
completion:
  record_outcome: true
  ask_rating: true
  follow_up_days: 3
  memory_write:
    kind: event
    tags:
    - protocol_outcome
safety_notes: Development draft, not a clinical intervention manual. Consent and risk gate required;
  pause/stop on discomfort, confusion, refusal, or increased distress. No trauma processing, diagnostic
  assessment or medical advice. No outcome guaranteed.
