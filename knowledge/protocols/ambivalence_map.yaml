schema: protocol.v1
id: ambivalence_map
version: 0.1.0
name: Explore both sides of a choice
family: planning
one_liner: Reflect the benefits and costs of change without pressing for a decision.
est_minutes: 7
evidence:
- ref: SAMHSA TIP 35 (2019), Motivational Interviewing
  level: standard_practice
fit_tags:
- motivation_ambivalence
- relationship_strain
- life_transition
eligibility:
  require_phase: []
  require_slots_filled: []
  require_risk_at_most: low
  min_user_readiness: medium
  forbid_flags:
  - psychosis_signs
  - mania_signs
  - dissociation
  - intoxication
  - unsafe_environment
  - medical_instability
  - coercion_present
  decline_cooldown_days: 0
  min_days_between_runs: 0
  max_runs_per_thread: 0
steps:
- id: both_sides
  goal: Give space to both motivations
  instruction: Invite one reason things stay as they are and one reason change is appealing. Reflect
    both with equal respect.
  expected_inputs:
  - reason_stay
  - reason_change
  success_criteria: both_sides_articulated
  ui:
    widget: none
  on_success: priority
  on_stuck:
    adapt: sides_easier
    after: 1
    then: pause
  on_distress: stop
  on_decline: stop
  adaptations:
  - id: sides_easier
    instruction: Ask which side feels louder today, without demanding justification.
- id: priority
  goal: Listen for what matters
  instruction: Ask which concern or value matters most to them right now; do not label resistance.
  expected_inputs:
  - priority
  success_criteria: priority_user_chosen
  ui:
    widget: none
  on_success: choice
  on_stuck:
    adapt: priority_easier
    after: 1
    then: pause
  on_distress: stop
  on_decline: stop
  adaptations:
  - id: priority_easier
    instruction: Offer a simple summary of the two needs and invite correction.
- id: choice
  goal: Leave the choice with the user
  instruction: Reflect the user’s own direction, including not deciding yet. Offer a small next step
    only if they invite it.
  expected_inputs:
  - choice
  success_criteria: choice_summarized
  ui:
    widget: none
  on_success: complete
  on_stuck:
    adapt: ''
    after: 0
    then: pause
  on_distress: stop
  on_decline: stop
  adaptations: []
offer:
  why_templates:
  - ambivalence_respected
  intents:
  - Explain the purpose briefly when it helps the user's choice.
  - Keep participation voluntary; accept skipping, pausing or changing direction.
stop_rules:
- when: risk_at_least_elevated
  action: stop
  note: safety_overrides_exercise
- when: user_declines
  action: stop
  note: respect_refusal
- when: distress_increases
  action: stop
  note: return_to_support
- when: topic_shift_later
  action: pause
  note: respect_topic_shift
  follow_up_days: 2
completion:
  record_outcome: true
  ask_rating: true
  follow_up_days: 3
  memory_write:
    kind: event
    tags:
    - protocol_outcome
safety_notes: Development draft, not a clinical intervention manual. Consent and risk gate required;
  pause/stop on discomfort, confusion, refusal, or increased distress. No trauma processing, diagnostic
  assessment or medical advice. No outcome guaranteed.
