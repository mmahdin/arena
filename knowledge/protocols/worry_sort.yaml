schema: protocol.v1
id: worry_sort
version: 0.1.0
name: Sort a worry
family: cbt
one_liner: Separate what can be acted on from uncertainty that cannot be solved now.
est_minutes: 6
evidence:
- ref: NICE CG113, CBT-based self-help
  level: standard_practice
fit_tags:
- worry
- stress
- overwhelm
eligibility:
  require_phase: []
  require_slots_filled: []
  require_risk_at_most: low
  min_user_readiness: medium
  forbid_flags:
  - psychosis_signs
  - mania_signs
  - dissociation
  - intoxication
  - unsafe_environment
  - medical_instability
  - coercion_present
  decline_cooldown_days: 0
  min_days_between_runs: 0
  max_runs_per_thread: 0
steps:
- id: worry
  goal: Name one worry briefly
  instruction: Ask for a single present worry in their own words. Avoid seeking disturbing specifics.
  expected_inputs:
  - worry
  success_criteria: worry_named
  ui:
    widget: none
  on_success: control
  on_stuck:
    adapt: worry_easier
    after: 1
    then: pause
  on_distress: stop
  on_decline: stop
  adaptations:
  - id: worry_easier
    instruction: Offer to use a broad title for the worry rather than details.
- id: control
  goal: Separate influence from uncertainty
  instruction: Invite a distinction between one part within influence and one that remains uncertain.
    Validate that uncertainty is uncomfortable.
  expected_inputs:
  - influence
  - uncertainty
  success_criteria: controllability_sorted
  ui:
    widget: none
  on_success: next_step
  on_stuck:
    adapt: control_easier
    after: 1
    then: pause
  on_distress: stop
  on_decline: stop
  adaptations:
  - id: control_easier
    instruction: 'Ask only: “Is there any small part you can influence?”'
- id: next_step
  goal: Choose action or a pause
  instruction: If influence exists, choose one safe step; otherwise choose how to return to the present.
    Do not enforce thought suppression.
  expected_inputs:
  - next_step
  success_criteria: next_step_chosen
  ui:
    widget: none
  on_success: complete
  on_stuck:
    adapt: ''
    after: 0
    then: pause
  on_distress: stop
  on_decline: stop
  adaptations: []
offer:
  why_templates:
  - worry_loop_visible
  intents:
  - Explain the purpose briefly when it helps the user's choice.
  - Keep participation voluntary; accept skipping, pausing or changing direction.
stop_rules:
- when: risk_at_least_elevated
  action: stop
  note: safety_overrides_exercise
- when: user_declines
  action: stop
  note: respect_refusal
- when: distress_increases
  action: stop
  note: return_to_support
- when: topic_shift_later
  action: pause
  note: respect_topic_shift
  follow_up_days: 2
completion:
  record_outcome: true
  ask_rating: true
  follow_up_days: 3
  memory_write:
    kind: event
    tags:
    - protocol_outcome
safety_notes: Development draft, not a clinical intervention manual. Consent and risk gate required;
  pause/stop on discomfort, confusion, refusal, or increased distress. No trauma processing, diagnostic
  assessment or medical advice. No outcome guaranteed.
