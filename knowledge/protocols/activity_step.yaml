schema: protocol.v1
id: activity_step
version: 0.1.0
name: One manageable activity
family: planning
one_liner: Choose a tiny low-pressure activity connected to routine, meaning or connection.
est_minutes: 6
evidence:
- ref: NICE NG222, behavioral activation
  level: standard_practice
fit_tags:
- low_mood
- avoidance
- overwhelm
eligibility:
  require_phase: []
  require_slots_filled: []
  require_risk_at_most: low
  min_user_readiness: medium
  forbid_flags:
  - psychosis_signs
  - mania_signs
  - dissociation
  - intoxication
  - unsafe_environment
  - medical_instability
  - coercion_present
  decline_cooldown_days: 0
  min_days_between_runs: 0
  max_runs_per_thread: 0
steps:
- id: activity
  goal: Notice one previously meaningful routine
  instruction: Ask about a low-stakes activity that used to feel worthwhile or necessary. Do not
    prescribe exercise, spending or social exposure.
  expected_inputs:
  - activity
  success_criteria: activity_identified
  ui:
    widget: none
  on_success: scale
  on_stuck:
    adapt: activity_easier
    after: 1
    then: pause
  on_distress: stop
  on_decline: stop
  adaptations:
  - id: activity_easier
    instruction: Offer the user a choice between rest, a basic task, or a tiny pleasant activity.
- id: scale
  goal: Make it small enough for current energy
  instruction: Invite the user to shrink the activity to something realistic on a hard day; doing
    nothing today may also be appropriate.
  expected_inputs:
  - small_version
  success_criteria: activity_scaled
  ui:
    widget: none
  on_success: plan
  on_stuck:
    adapt: scale_easier
    after: 1
    then: pause
  on_distress: stop
  on_decline: stop
  adaptations:
  - id: scale_easier
    instruction: Ask what a two-minute version could look like, only if desired.
- id: plan
  goal: Make a reversible plan
  instruction: Let the user pick when, where, and a backup. Frame it as an experiment in feasibility,
    not a cure or obligation.
  expected_inputs:
  - when
  - where
  - backup
  success_criteria: activity_plan_specific
  ui:
    widget: none
  on_success: review
  on_stuck:
    adapt: plan_easier
    after: 1
    then: pause
  on_distress: stop
  on_decline: stop
  adaptations:
  - id: plan_easier
    instruction: Set only a possible time; leave backup optional.
- id: review
  goal: Agree how to notice its effect
  instruction: Ask what they might observe afterward, without requiring a mood change or immediate
    completion.
  expected_inputs:
  - observation_plan
  success_criteria: activity_reviewed
  ui:
    widget: none
  on_success: complete
  on_stuck:
    adapt: ''
    after: 0
    then: pause
  on_distress: stop
  on_decline: stop
  adaptations: []
offer:
  why_templates:
  - tiny_step_option
  intents:
  - Explain the purpose briefly when it helps the user's choice.
  - Keep participation voluntary; accept skipping, pausing or changing direction.
stop_rules:
- when: risk_at_least_elevated
  action: stop
  note: safety_overrides_exercise
- when: user_declines
  action: stop
  note: respect_refusal
- when: distress_increases
  action: stop
  note: return_to_support
- when: topic_shift_later
  action: pause
  note: respect_topic_shift
  follow_up_days: 2
completion:
  record_outcome: true
  ask_rating: true
  follow_up_days: 3
  memory_write:
    kind: event
    tags:
    - protocol_outcome
safety_notes: Development draft, not a clinical intervention manual. Consent and risk gate required;
  pause/stop on discomfort, confusion, refusal, or increased distress. No trauma processing, diagnostic
  assessment or medical advice. No outcome guaranteed.
