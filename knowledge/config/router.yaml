# SYNTHETIC WP-03 CONTRACT FIXTURE ONLY. NOT CLINICALLY REVIEWED; NEVER SHIP TO USERS.
schema: router.v1
rules:
- id: RT-001
  when:
  - safety_level_gte: high
  route: crisis
- id: RT-002
  when:
  - origin_is: wakeup
  route: proactive
- id: RT-003
  when:
  - risk_follow_up_active: true
  route: normal
  set:
    risk_constraints: true
    force_buffered_output: true
- id: RT-004
  when:
  - safety_level_gte: elevated
  route: normal
  set:
    risk_constraints: true
    force_buffered_output: true
    shortlist: false
- id: RT-005
  when:
  - trivial_message: true
  - pending_question: false
  - protocol_active: false
  - safety_level_lte: low
  route: fast
- id: RT-099
  when: []
  route: normal
trivial_patterns:
  en:
    greetings: []
    thanks: []
    acks: []
    max_chars: 24
shortlist_rules:
  allowed_when:
    any:
    - protocol_active: true
  blocked_when:
  - 'safety_level_gte: elevated'
  max_items: 5
