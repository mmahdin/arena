# UNREVIEWED DEVELOPMENT CONTENT. Synthetic testing only; clinical and native Persian review required.
schema: crisis_templates.v1
templates:
  immediate_safety:
    text: Thank you for telling me. I am concerned about your immediate safety, and you deserve support from
      a person who can help now. If you might act on thoughts of harming yourself or someone else, or cannot
      stay safe, call your local emergency number or go to an emergency department now; if safe, ask a trusted
      person to stay with you. For country-specific crisis contacts, https://findahelpline.com is a directory,
      not a live hotline. Are you at risk of acting on this soon? You can share only what feels necessary for
      the next safe step.
    locales:
      fa: >-
        ممنون که گفتی. نگران امنیتت هستم و سزاوار کمک کسی هستی که بتواند همین حالا کنارت باشد. اگر ممکن است
        به خودت یا کس دیگری آسیب بزنی یا نمی‌توانی در امان بمانی، همین حالا با اورژانس محل زندگی‌ات تماس
        بگیر یا به بخش اورژانس برو؛ اگر امن است، از فردی قابل اعتماد بخواه کنارت بماند. برای پیدا کردن
        راه‌های تماس با حمایت در کشور خودت، https://findahelpline.com یک فهرست راهنماست و خودش خط کمک فوری
        نیست. آیا احتمال دارد به‌زودی به این فکرها عمل کنی؟ می‌توانی فقط به اندازه‌ای که برای قدم امن بعدی
        لازم است بگویی.
  unsafe_environment:
    text: I am sorry you are facing this, and I am concerned about your safety. You do not have to explain
      details or confront anyone here. If there is immediate danger, call your local emergency number; if it
      is safe to do so, contact a trusted person or a local specialist support service from a safe device or
      place. https://findahelpline.com is a directory for country-specific support contacts, not a live hotline.
      Are you somewhere you can communicate safely right now? We can focus only on the next safe step.
    locales:
      fa: >-
        متأسفم که در چنین موقعیتی هستی و نگران امنیتت هستم. لازم نیست اینجا جزئیات را توضیح بدهی یا با کسی
        روبه‌رو شوی. اگر خطر فوری وجود دارد، با اورژانس محل زندگی‌ات تماس بگیر؛ اگر امن است، از یک مکان یا
        دستگاه امن با فردی قابل اعتماد یا خدمات حمایتی محلی تماس بگیر. https://findahelpline.com فهرستی از
        راه‌های دریافت حمایت در کشورهای مختلف است و خودش خط کمک فوری نیست. آیا الان جایی هستی که بتوانی با
        خیال امن صحبت کنی؟ می‌توانیم فقط روی قدم امن بعدی تمرکز کنیم.
  urgent_medical:
    text: What you described may need urgent in-person medical attention. I am concerned about your safety,
      and online conversation cannot assess or treat an emergency. Please call your local emergency number
      or seek emergency medical care now; if safe, ask someone nearby to help you get support. For country-specific
      crisis contacts, https://findahelpline.com is a directory, not a live hotline. Can you contact local
      emergency services or someone nearby now? You can reply briefly if it is safe to do so.
    locales:
      fa: >-
        چیزی که گفتی ممکن است به رسیدگی فوری پزشکی نیاز داشته باشد. نگران امنیتت هستم و گفت‌وگوی آنلاین
        نمی‌تواند وضعیت اضطراری را ارزیابی یا درمان کند. لطفاً همین حالا با اورژانس محل زندگی‌ات تماس بگیر
        یا به اورژانس برو؛ اگر امن است، از کسی که نزدیکت است برای گرفتن کمک همراهی بخواه.
        https://findahelpline.com فهرستی برای پیدا کردن راه‌های تماس با حمایت در کشور خودت است و خودش خط کمک
        فوری نیست. آیا می‌توانی همین حالا با اورژانس یا کسی که نزدیکت است تماس بگیری؟ اگر امن است، می‌توانی
        کوتاه جواب بدهی.
  resources_general_notice:
    text: The listed resource is an international directory, not an emergency service or a live crisis line.
      Check its country-specific listings, and use your local emergency number for immediate danger.
    locales:
      fa: >-
        منبع معرفی‌شده یک فهرست بین‌المللی است و خودش خدمات اورژانس یا خط کمک فوری نیست. گزینه‌های مربوط به
        کشور خودت را بررسی کن و در خطر فوری با اورژانس محل زندگی‌ات تماس بگیر.
