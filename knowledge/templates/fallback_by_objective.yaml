# UNREVIEWED DEVELOPMENT CONTENT. Synthetic testing only; clinical and native Persian review required.
schema: fallback.v1
templates:
  reflect:
    id: fallback_reflect
    text: It sounds like a lot is happening at once, and I may not have every detail right. I am here to listen
      if you want to say more.
    locales:
      fa: >-
        انگار چند چیز هم‌زمان روی دلت سنگینی می‌کند و شاید همه جزئیات را درست نفهمیده باشم. اگر دوست داری
        بیشتر بگویی، گوش می‌دهم.
  validate_and_support:
    id: fallback_validate_and_support
    text: That sounds difficult. It makes sense to want some room to talk about it, without having to solve
      it immediately.
    locales:
      fa: >-
        به نظر تجربه سختی می‌آید. قابل فهم است که بخواهی بدون عجله برای حل کردنش، کمی درباره‌اش حرف بزنی.
  clarify:
    id: fallback_clarify
    text: I want to understand rather than guess. Which part of what happened feels most important to you?
    locales:
      fa: >-
        می‌خواهم درست بفهمم و حدس نزنم. کدام بخش این اتفاق برایت مهم‌تر است؟
  explore:
    id: fallback_explore
    text: There may be more than one part to this experience. We could look at what happened, what it meant
      to you, or what you need now.
    locales:
      fa: >-
        شاید این تجربه چند بخش داشته باشد. می‌توانیم درباره اتفاقی که افتاد، معنایی که برایت داشت یا چیزی که
        الان نیاز داری صحبت کنیم.
  provide_insight:
    id: fallback_provide_insight
    text: Sometimes a feeling, a thought, and an action influence one another. That is only a possible lens,
      not a conclusion about you. Does any part of that fit?
    locales:
      fa: >-
        گاهی احساس، فکر و رفتار روی هم اثر می‌گذارند. این فقط یک زاویه نگاه احتمالی است، نه نتیجه‌گیری
        درباره تو. چیزی از آن با تجربه‌ات جور درمی‌آید؟
  provide_guidance:
    id: fallback_provide_guidance
    text: One option is to choose a small, manageable next step rather than trying to resolve everything. We
      can consider what feels realistic for you.
    locales:
      fa: >-
        یک گزینه این است که قدمی کوچک و شدنی انتخاب کنیم. می‌توانیم ببینیم با شرایطت چه کاری برایت عملی‌تر
        است.
  offer_intervention:
    id: fallback_offer_intervention
    text: If it would be useful, we could try a short, optional reflection exercise together. There is no need
      to do it if you would rather keep talking.
    locales:
      fa: >-
        می‌توانیم فعلاً درباره چیزی که برایت مهم است حرف بزنیم. لازم نیست برای ادامه این گفت‌وگو کاری انجام
        بدهی.
  continue_intervention:
    id: fallback_continue_intervention
    text: We can continue with the next small part at your pace, or pause and return to ordinary conversation
      at any point.
    locales:
      fa: >-
        می‌توانیم مکث کنیم و درباره احساست نسبت به این گفت‌وگو حرف بزنیم. عجله‌ای برای ادامه دادن نیست.
  close_or_pause_intervention:
    id: fallback_close_or_pause_intervention
    text: We can stop the exercise here. You do not need to finish it for this conversation to count. We can
      talk about what was useful or simply change direction.
    locales:
      fa: >-
        می‌توانیم همین‌جا مکث کنیم. لازم نیست چیزی را تمام کنی؛ می‌توانیم درباره بخش مفیدش حرف بزنیم یا
        موضوع را عوض کنیم.
  review_progress:
    id: fallback_review_progress
    text: It could be worth noticing what felt different, what stayed hard, or what did not help. Your own
      assessment matters most.
    locales:
      fa: >-
        می‌توانیم ببینیم چه چیزی فرق کرده، چه چیزی هنوز سخت است یا چه چیزی کمکی نکرده. برداشت خودت برای این
        بررسی مهم است.
  summarize:
    id: fallback_summarize
    text: So far I hear that this matters to you and there are some unanswered parts. I do not want to assume
      I have the whole picture. What would you like me to keep in focus?
    locales:
      fa: >-
        تا اینجا می‌فهمم که این موضوع برایت مهم است و بخش‌هایی هنوز روشن نیست. نمی‌خواهم فرض کنم همه‌چیز را
        فهمیده‌ام. دوست داری روی کدام بخش تمرکز کنیم؟
  repair:
    id: fallback_repair
    text: I may have misunderstood what you meant. Thank you for correcting me. I will not treat my earlier
      interpretation as a fact; we can start with your words instead.
    locales:
      fa: >-
        ممکن است منظورت را درست نفهمیده باشم. ممنون که اصلاحش کردی. برداشت قبلی‌ام را واقعیت در نظر نمی‌گیرم
        و می‌توانیم از حرف خودت شروع کنیم.
  answer_direct:
    id: fallback_answer_direct
    text: I can share general information and help you consider options, but I may need more context to give
      a useful answer. What aspect would you like to focus on?
    locales:
      fa: >-
        می‌توانم اطلاعات کلی بدهم و کمک کنم گزینه‌ها را بررسی کنی. دوست داری روی کدام بخش تمرکز کنیم؟
  boundary:
    id: fallback_boundary
    text: I can offer supportive reflection and general information, but I cannot diagnose a condition, prescribe
      treatment, or replace an in-person professional.
    locales:
      fa: >-
        می‌توانم گوش بدهم و اطلاعات کلی بدهم، اما نمی‌توانم تشخیص بدهم، دارو تجویز کنم یا جای متخصص را
        بگیرم.
  safety_support:
    id: fallback_safety_support
    text: Your safety matters. If you might be in immediate danger, contact local emergency services or an
      emergency department. You can also find country-specific support contacts via the directory at https://findahelpline.com,
      which is not itself a live hotline. Is there someone safe nearby you can contact?
    locales:
      fa: >-
        امنیتت مهم است. اگر خطر فوری وجود دارد، با اورژانس محل زندگی‌ات تماس بگیر یا به بخش اورژانس برو.
        برای پیدا کردن راه‌های دریافت حمایت در کشور خودت، https://findahelpline.com یک فهرست راهنماست و خودش
        خط کمک فوری نیست. آیا فرد امنی نزدیکت هست که بتوانی با او تماس بگیری؟
    includes_resources: true
