schema: formulation.v1
framework: cbt_conceptualization
select_when:
  problem_tags_any:
  - anxiety_social
  - self_critical_thoughts
  - low_mood
  - worry
  - avoidance
fields:
- id: situation
  allowed_status:
  - reported
  min_evidence: 1
  min_sessions: 1
  wording: factual
- id: automatic_thought
  allowed_status:
  - reported
  - inferred
  min_evidence: 1
  min_sessions: 1
  wording: tentative
- id: emotion
  allowed_status:
  - reported
  min_evidence: 1
  min_sessions: 1
  wording: factual
- id: behavior
  allowed_status:
  - reported
  min_evidence: 1
  min_sessions: 1
  wording: factual
- id: short_term_consequence
  allowed_status:
  - reported
  - inferred
  min_evidence: 2
  min_sessions: 1
  wording: tentative
- id: maintaining_pattern
  allowed_status:
  - inferred
  min_evidence: 2
  min_sessions: 2
  wording: tentative
  voiceable: false
- id: core_belief_hypothesis
  allowed_status:
  - inferred
  min_evidence: 3
  min_sessions: 3
  wording: tentative
  voiceable: false
rules:
- Separate situations, interpretations, feelings, actions and consequences; do not label a thought
  as objectively false.
- Every value must cite permitted evidence message IDs; omit/mark unknown when min_evidence or min_sessions
  is not met.
- Inferred patterns are tentative, open to alternatives and not diagnoses. Never voice core-belief
  hypotheses.
- Do not fill missing information from demographic stereotypes or recalled material without explicit
  AI-use authorization.
paragraph:
  max_words: 90
  must_mark_inferred: true
