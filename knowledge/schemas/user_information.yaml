schema: userinfo.v1
fields:
- id: preferred_name
  group: general
  purpose: Use preferred address only if explicitly provided; do not repeatedly ask.
  sensitivity: normal
  collect:
    proactive: false
  update_rule: overwrite_on_user_statement
  ask_cost: 0.1
- id: language
  group: preference
  purpose: Use the language the user chooses, only where locale assets exist.
  sensitivity: normal
  collect:
    proactive: true
    condition: onboarding_or_first_session
  update_rule: overwrite_on_user_statement
  ask_cost: 0.1
- id: response_length
  group: preference
  purpose: Match the preferred amount of detail; confirm before storing inferred preference.
  sensitivity: normal
  collect:
    proactive: false
    infer_from_behavior: true
    confirm_before_store: true
  update_rule: overwrite_on_user_statement
  ask_cost: 0.1
- id: conversation_style
  group: preference
  purpose: Respect a wish to be heard, get practical options or have questions.
  sensitivity: normal
  collect:
    proactive: false
  update_rule: overwrite_on_user_statement
  ask_cost: 0.15
- id: current_supports
  group: general
  purpose: Understand supports only when relevant and voluntarily shared.
  sensitivity: sensitive
  collect:
    proactive: false
    condition: user_mentions_supports
  update_rule: append_with_evidence
  ask_cost: 0.4
- id: occupation
  group: general
  purpose: Understand a work-related concern, not collect profile details.
  sensitivity: normal
  collect:
    proactive: false
    condition: thread_mentions_work
  update_rule: overwrite_on_user_statement
  ask_cost: 0.25
- id: trauma_history
  group: history
  purpose: Only note a volunteered contraindication with independent consent, never ask details.
  sensitivity: highly_sensitive
  collect:
    proactive: false
  update_rule: append_with_evidence
  ask_cost: 0.95
- id: medication_history
  group: history
  purpose: Only use volunteered information to recommend medical review, not medication guidance.
  sensitivity: highly_sensitive
  collect:
    proactive: false
  update_rule: append_with_evidence
  ask_cost: 0.95
