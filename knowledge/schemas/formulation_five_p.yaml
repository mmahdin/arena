schema: formulation.v1
framework: five_p_lite
select_when:
  problem_tags_any:
  - stress
  - overwhelm
  - conflict
  - loneliness
  - grief
  - motivation_ambivalence
  - sleep_strain
  - life_transition
  - relationship_strain
fields:
- id: presenting
  allowed_status:
  - reported
  min_evidence: 1
  min_sessions: 1
  wording: factual
- id: predisposing
  allowed_status:
  - inferred
  min_evidence: 3
  min_sessions: 3
  wording: tentative
  voiceable: false
- id: precipitating
  allowed_status:
  - reported
  - inferred
  min_evidence: 1
  min_sessions: 1
  wording: tentative
- id: perpetuating
  allowed_status:
  - inferred
  min_evidence: 2
  min_sessions: 2
  wording: tentative
  voiceable: false
- id: protective
  allowed_status:
  - reported
  min_evidence: 1
  min_sessions: 1
  wording: factual
rules:
- Five P is a tentative organizing lens, not a diagnosis or a causal conclusion.
- Only consider antecedents and maintainers when independently supported; never infer traumatic history
  or character traits.
- Include volunteered strengths/protective factors; do not manufacture supports.
- Unknown or below-threshold fields remain unknown; do not claim clinical certainty.
paragraph:
  max_words: 90
  must_mark_inferred: true
