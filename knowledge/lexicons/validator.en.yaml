schema: validator_lexicon.v1
locale: en
hedges:
- might
- may
- perhaps
- possibly
- could
- it sounds like
- i wonder whether
- one possibility
- i may be wrong
question_patterns:
- '[?]'
- (?i)\b(?:what|how|when|where|why|would you|could you|do you|are you|is there)\b
clinical_labels:
- depression
- bipolar disorder
- ptsd
- generalized anxiety disorder
- ocd
- eating disorder
- borderline personality disorder
patterns:
  diagnosis:
  - (?i)\byou (?:have|definitely have|are suffering from|are diagnosed with) (?:depression|bipolar disorder|ptsd|ocd|an
    anxiety disorder|borderline personality disorder)\b
  - (?i)\bthat (?:proves|means) you have (?:depression|ptsd|ocd)\b
  medication:
  - (?i)\b(?:start|stop|double|halve|increase|decrease) (?:taking )?(?:your|the) (?:medication|antidepressant|prescription|dose)\b
  - (?i)\btake \d+\s*(?:mg|pills|tablets)\b
  guarantee:
  - (?i)\b(?:i guarantee|this (?:will|definitely will) (?:cure|fix)|you will definitely recover)\b
  therapist_identity:
  - (?i)\b(?:i am|i\x27m|as) your (?:therapist|psychiatrist|doctor)\b
  directive_advice:
  - (?i)\byou (?:must|have to|should|need to) (?:forgive|confront|break up|quit|ignore|accept)\b
  internal_leak:
  - (?i)\b(?:response_plan|risk_fsm|memory_id|internal_prompt|system_instruction|client_turn_id|schema_version|brain\.v\d+)\b
  technique:
  - (?i)\b(?:let\x27s do|try|complete|start) (?:a|the|this) (?:thought record|grounding exercise|breathing
    exercise|exposure exercise|behavioral activation exercise)\b
  dependency:
  - (?i)\b(?:only i (?:understand|can help) you|you (?:only|just) need me|don\x27t (?:talk to|need) anyone
    else)\b
  invalidating:
  - (?i)\b(?:just get over it|stop overreacting|you are being dramatic|there is nothing to be upset about)\b
  crisis_forbidden:
  - (?i)\b(?:here is how to (?:hurt|harm|kill) (?:yourself|someone)|i (?:can|will) (?:send an ambulance|contact
    emergency services) for you)\b
