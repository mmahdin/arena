# UNREVIEWED DEVELOPMENT CONTENT. Synthetic testing only; clinical and native Persian review required.
schema: validator_lexicon.v1
locale: fa
hedges:
- شاید
- ممکن است
- ممکنه
- به نظر می
- احتمال دارد
- برداشت من
- انگار
question_patterns:
- ^[\s]*(?:آیا|چطور|چگونه|چرا|چه چیزی|کدام|دوست داری|می خواهی|می خوای)(?:\s|$)
clinical_labels:
- افسردگی
- اختلال اضطراب
- وسواس
- اختلال دوقطبی
- اختلال شخصیت مرزی
patterns:
  diagnosis:
  - (?:تو|شما)\s+(?:قطعا\s+|قطعاً\s+|حتماً\s+)?(?:افسردگی|اختلال اضطراب|وسواس|اختلال دوقطبی)\s+(?:داری|دارید)
  - (?:تو|شما)\s+(?:دچار|مبتلا به)\s+(?:افسردگی|وسواس|اختلال)
  - (?:تو|شما)\s+افسرده\s+(?:هستی|اید|ای)
  medication:
  - (?:دارو\S*|دوز\S*|قرص\S*)\s+(?:(?:را|رو|خودت|خودتان|به|طور|ناگهانی)\s+)*(?:قطع|شروع|دوبرابر|نصف|زیاد|کم)\s+(?:کن|کنید|بکن)
  - (?:قطع|شروع)\s+(?:کن|کنید)\s+(?:دارو|قرص)
  - '[0-9]+\s*(?:میلی\s*گرم|قرص)\s+(?:بخور|مصرف کن)'
  guarantee:
  - تضمین می\s*(?:کنم|دهم)
  - (?:حتماً|قطعا|قطعاً)\s+(?:خوب|درمان)\s+می\s*(?:شوی|شی|شوید)
  therapist_identity:
  - (?:من\s+)?(?:روان\s*شناس|درمانگر|روانپزشک|پزشک)\s+(?:تو|شما)\s+(?:هستم|ام)
  directive_advice:
  - (?:تو|شما)?\s*(?:باید|مجبوری|مجبورید)\s+(?:ببخشی|ببخشید|رابطه\S* را قطع|استعفا|مقابله|فراموش)
  internal_leak:
  - (?i)(?:response_plan|memory_id|system_instruction|brain\.v[0-9]+)
  - (?:دستورالعمل داخلی|شناسه حافظه)\s*[:：]
  technique:
  - (?:بیا|بیایید|شروع کن|انجام بده)\s+(?:یک\s+)?تمرین\s+(?:تنفس|مواجهه|ذهن آگاهی)
  - تمرین\s+(?:تنفس|مواجهه)\s+(?:را\s+)?(?:انجام بده|شروع کن)
  dependency:
  - فقط من\s+(?:تو را|تورو|شما را)\s+(?:می\s*فهمم|درک می\s*کنم)
  - (?:فقط|تنها)\s+به من\s+(?:نیاز داری|احتیاج داری)
  - با هیچ\s*کس\s+(?:دیگر|دیگه)\s+حرف نزن
  invalidating:
  - (?:زیادی|بیش از حد)\s+(?:حساس|شلوغش)\s+(?:هستی|می\s*کنی)
  - چیزی نیست که\s+(?:بخاطرش|به خاطرش)\s+ناراحت
  - فقط فراموشش کن
  crisis_forbidden:
  - (?:برای|روش|نحوه)\s+(?:خودکشی|آسیب زدن به خودت)\s*[:：]
  - (?:من\s+)?(?:برایت|برات|برای شما)\s+(?:آمبولانس|اورژانس|پلیس)\s+(?:خبر می\s*کنم|می\s*فرستم)
