# UNREVIEWED DEVELOPMENT CONTENT. Synthetic tests only; native Persian and clinical review required.
schema: lexicon.v1
version: development-fa-0.1.0
locale: fa
rules:
- id: fa.development.suicide
  category: suicidal_ideation
  level: high
  match:
    type: regex
    pattern: (?:می\s*خوا(?:هم|م)\s+خودکشی\s+کنم|قصد\s+خودکشی\s+دارم|به\s+خودکشی\s+فکر\s+می\s*کنم|می\s*خوا(?:هم|م)\s+(?:بمیرم|خودم\S*\s+(?:را\s+)?بکشم)|کاش\s+(?:مرده
      بودم|نبودم)|دیگر نمی\s*خواهم زنده بمانم|دیگه نمی\s*خوام زنده بمونم)
  second_look: false
- id: fa.development.self_harm
  category: self_harm
  level: high
  match:
    type: regex
    pattern: (?:به خودم\s+آسیب\s+(?:بزنم|می\s*زنم)|خودم\S*\s+(?:را\s+)?زخمی\s+(?:کنم|کردم)|خودزنی\s+می\s*کنم)
  second_look: false
- id: fa.development.violence
  category: harm_to_others
  level: high
  match:
    type: regex
    pattern: (?:می\s*خوا(?:هم|م)\s+(?:او|اونو|کسی|یکی)\s+(?:را\s+)?بکشم|به\s+(?:او|کسی)\s+آسیب\s+بزنم)
  second_look: false
- id: fa.development.abuse
  category: abuse_disclosure
  level: high
  match:
    type: regex
    pattern: (?:من\S*\s+(?:را\s+)?کتک\s+می\s*زند|منو\s+می\s*زنه|بهم\s+تجاوز\s+کرده|در خانه\s+امن\s+نیستم)
  second_look: false
- id: fa.development.medical
  category: medical_emergency
  level: imminent
  match:
    type: regex
    pattern: (?:نمی\s*توانم\s+نفس\s+بکشم|نمی\s*تونم\s+نفس\s+بکشم|خونریزی\s+(?:شدید|بند نمی)|درد\s+شدید\s+قفسه\s+سینه)
  second_look: false
- id: fa.development.overdose
  category: substance_crisis
  level: imminent
  match:
    type: regex
    pattern: (?:اوردوز\s+(?:کردم|کرده)|بیش\s+از\s+حد\s+قرص\s+خوردم|همه\s+قرص(?:\s*ها)?\s+(?:را\s+)?خوردم)
  second_look: false
