# OBS-02: opt-in local Phoenix *separate Compose project*. Run ONLY via
# docker compose -p theia-observability -f compose.observability.dev.yaml ...
# Do not merge this file into the Go API's public/User/Admin Compose stack.
services:
  phoenix:
    profiles: [observability]
    # Pinned and reviewed 2026-11-21 release; do not use :latest.
    image: arizephoenix/phoenix:version-22.0.1
    init: true
    environment:
      PHOENIX_HOST: "0.0.0.0"  # inside container only; host port is loopback-only
      PHOENIX_PORT: "6006"
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: ${PHOENIX_SECRET:?Run python3 scripts/observability/init_local_phoenix_env.py}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD:?Run python3 scripts/observability/init_local_phoenix_env.py}
      PHOENIX_ENABLE_STRONG_PASSWORD_POLICY: "true"
      PHOENIX_CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:6006"
      PHOENIX_ALLOWED_ORIGINS: "http://127.0.0.1:6006"
      PHOENIX_USE_SECURE_COOKIES: "false"  # HTTP on developer loopback ONLY
      PHOENIX_WORKING_DIR: /var/lib/phoenix
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "7"
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ALLOWED_PROVIDERS: NONE
      PHOENIX_ALLOWED_SANDBOX_PROVIDERS: NONE
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix_data:/var/lib/phoenix
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  phoenix_data:
