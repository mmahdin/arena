# PROD-02: isolated, LOCAL synthetic analytics. Layer over compose.yaml with
# the same Compose project; never publish this overlay to the internet.
# Metabase's APPLICATION STATE lives in PostgreSQL; its REPORT SOURCE is
# SQL Server, via a dedicated reader that can SELECT approved views only.
services:
  analytics-postgres:
    profiles: [analytics]
    image: postgres:16.16-alpine
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${THEIA_METABASE_POSTGRES_PASSWORD:?Run python3 scripts/analytics/init_local_analytics_env.py}
    volumes:
      - theia_metabase_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    # Official Postgres entrypoint needs ownership/setuid operations on first boot.
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  metabase:
    profiles: [analytics]
    image: metabase/metabase:v0.64.8.3
    depends_on:
      analytics-postgres: {condition: service_healthy}
      mssql: {condition: service_started}
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_HOST: analytics-postgres
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase
      MB_DB_PASS: ${THEIA_METABASE_POSTGRES_PASSWORD:?Run python3 scripts/analytics/init_local_analytics_env.py}
      MB_ENCRYPTION_SECRET_KEY: ${THEIA_METABASE_ENCRYPTION_SECRET_KEY:?Run python3 scripts/analytics/init_local_analytics_env.py}
      MB_SITE_URL: http://127.0.0.1:3100
      MB_LOAD_SAMPLE_CONTENT: "false"
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      MB_NO_SURVEYS: "true"
      MB_PASSWORD_COMPLEXITY: strong-enough
      MB_ENABLE_PUBLIC_SHARING: "false"
      MB_ENABLE_EMBEDDING_MODULAR: "false"
      MB_ENABLE_EMBEDDING_INTERACTIVE: "false"
      MB_ENABLE_EMBEDDING_SDK: "false"
      JAVA_OPTS: -Xms256m -Xmx1024m
    ports:
      - "127.0.0.1:3100:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  theia_metabase_pg_data:
