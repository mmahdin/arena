# AUTH-03 optional BFF API environment overlay.
# Run after compose.auth.yaml is healthy, with BOTH .env and .env.auth.
services:
  api:
    environment:
      AUTH_BROWSER_SMOKE_ENABLED: ${AUTH_BROWSER_SMOKE_ENABLED:-false}
      AUTH_BFF_ENABLED: ${AUTH_BFF_ENABLED:-false}
      AUTH_STAFF_LOGIN_ENABLED: ${AUTH_STAFF_LOGIN_ENABLED:-false}
      AUTH_USER_LOGIN_ENABLED: ${AUTH_USER_LOGIN_ENABLED:-false}
      AUTH_USER_SMS_FLOW_VERIFIED: ${AUTH_USER_SMS_FLOW_VERIFIED:-false}
      AUTH_BFF_KEY_BASE64: ${AUTH_BFF_KEY_BASE64:?Run scripts/auth/ensure_local_bff_key.py}
      AUTH_KEYCLOAK_BASE_URL: http://auth.localhost:8180
      AUTH_USER_ORIGIN: http://app.localhost:8080
      AUTH_STAFF_ORIGIN: http://admin.localhost:8080
      THEIA_USERS_BFF_CLIENT_SECRET: ${THEIA_USERS_BFF_CLIENT_SECRET:?Missing user client secret}
      THEIA_STAFF_BFF_CLIENT_SECRET: ${THEIA_STAFF_BFF_CLIENT_SECRET:?Missing staff client secret}
