<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240">
<style>
  .fg { fill: #221f19; } .clay { fill: #b9775a; } .paper { fill: #f4f1ea; }
  text { font-family: 'Estedad'; fill: #221f19; }
  .naskh { font-family: 'Noto Naskh Arabic'; }
  .muted { fill: #6f6a61; }
  .line { stroke: #221f19; stroke-width: 1; opacity: .18; fill: none; }
  .k-figure.k-fg { fill: #221f19; }
  .k-figure.k-accent { fill: #b9775a; }
  .k-shawl { fill: none; stroke: rgba(70,28,16,.24); stroke-width: 2.2; stroke-linecap: round; }
  .k-paper-fill { fill: #f4f1ea; }
  .k-accent-fill { fill: #b9775a; }
  .k-accent-stroke { fill: none; stroke: #b9775a; stroke-width: 1; }
  .k-line { fill: none; stroke: #221f19; stroke-width: 2.6; stroke-linecap: round; }
  .k-far { fill: none; stroke: #b9775a; stroke-width: 1.2; stroke-linecap: round; opacity: .22; }
  .k-ripple-line { fill: none; stroke: #b9775a; stroke-width: 1.3; stroke-linecap: round; opacity: .5; }
  .kenar-mark .k-line { stroke-width: 2.8; opacity: .9; }
  .k-ripple circle { fill: none; stroke: #b9775a; }

  .k-darkfg { fill: #f1ece2; } .k-dline { stroke: #f1ece2; stroke-width: 2.6; fill: none; stroke-linecap: round; }
</style>
<rect width="1800" height="1240" fill="#f4f1ea"/>

<!-- header -->
<text x="1720" y="132" text-anchor="end" class="naskh" font-size="108" letter-spacing="-1">کنار</text>
<path d="M 1372 150 C 1500 145 1660 154 1742 147" class="line" stroke="#221f19" stroke-width="2" opacity=".45"/>
<circle cx="1373" cy="149" r="9" class="clay"/>
<text x="1720" y="196" text-anchor="end" font-size="19" letter-spacing="4" class="muted">KENAR · VISUAL IDENTITY</text>
<text x="80" y="112" font-size="30">هویت بصری کنار</text>
<text x="80" y="152" font-size="17" class="muted">یک کرانه. دو همنشین. جای تو، همیشه نگه‌داشته.</text>
<path d="M80 232 L1720 232" class="line"/>

<!-- left: concept -->
<g>
  <text x="80" y="300" font-size="15" letter-spacing="3" class="muted">THE IDEA</text>
  <text x="80" y="356" font-size="34">کنار یعنی کسی همین نزدیکی.</text>
  <text x="80" y="404" font-size="17" class="muted">نه روبه‌رویت، نه بالای سرت؛ کنارت.</text>
  <text x="80" y="438" font-size="17" class="muted">همهٔ هویت از همین یک جمله ساخته شده است.</text>

  <text x="80" y="512" font-size="15" letter-spacing="3" class="muted">THE SUBJECT</text>
  <text x="80" y="556" font-size="25">دو نشسته، روی یک خطِ نشکسته</text>
  <text x="80" y="594" font-size="16" class="muted">خط، کرانه است؛ دو فرم، دو همنشین.</text>
  <text x="80" y="622" font-size="16" class="muted">فرم گِلی همیشه کنار است — گرم، ساکن، شنوا.</text>

  <text x="80" y="696" font-size="15" letter-spacing="3" class="muted">PRINCIPLES</text>
  <text x="80" y="740" font-size="19">حرف نمی‌زند؛ می‌نشیند.</text>
  <text x="80" y="774" font-size="19">جای خالی را نگه می‌دارد، پرش نمی‌کند.</text>
  <text x="80" y="808" font-size="19">گرم است، نه پرسروصدا.</text>
  <text x="80" y="842" font-size="19">همیشه یکی هست که کنارت باشد.</text>
</g>

