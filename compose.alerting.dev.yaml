# MON-02: opt-in, local synthetic-only alerts overlay; combine with
# compose.yaml + compose.monitoring.dev.yaml (and optional logging overlay).
# Exactly one notifier: Prometheus -> Alertmanager -> local Mailpit SMTP inbox.
services:
  alerting-init:
    profiles: [monitoring]
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-ec", "chown -R 65534:65534 /alertmanager && chmod 0700 /alertmanager"]
    volumes:
      - theia_alertmanager_data:/alertmanager
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  prometheus:
    volumes:
      # Replaces the same destination mounted by MON-01A. Keeps basic
      # monitoring fully functional when MON-02 overlay is omitted.
      - ./infra/monitoring/prometheus.alerting.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts:/etc/prometheus/rules:ro
    depends_on:
      alertmanager: {condition: service_started}

  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.35.0
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager
      - --data.retention=72h
      - --web.listen-address=0.0.0.0:9093
    depends_on:
      alerting-init: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    volumes:
      - ./infra/monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - theia_alertmanager_data:/alertmanager
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  mailpit:
    profiles: [monitoring]
    image: axllent/mailpit:v1.31.2
    environment:
      MP_ALLOWED_HOSTS: "127.0.0.1:8025,localhost:8025,mailpit:8025"
      MP_MAX_MESSAGES: "200"
      MP_MAX_AGE: "2d"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
    ports:
      - "127.0.0.1:8025:8025"
    # SMTP port 1025 is internal only; no real email ever leaves this project.
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # Test-only one-shot tool. NEVER run with the normal monitoring profile.
  alert-smoke:
    profiles: [alert-test]
    image: python:3.13-alpine
    command: ["python3", "/app/emit_synthetic_alert.py"]
    volumes:
      - ./scripts/monitoring/emit_synthetic_alert.py:/app/emit_synthetic_alert.py:ro
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  grafana:
    depends_on:
      alertmanager: {condition: service_started}

volumes:
  theia_alertmanager_data:
