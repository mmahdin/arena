# MON-02: overlays the original MON-01A Prometheus config; do not mount this
# file unless the isolated Alertmanager service is deployed too.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: theia-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          service: theia-api
          environment: local
  - job_name: theia-alertmanager
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: theia-alertmanager
          environment: local
