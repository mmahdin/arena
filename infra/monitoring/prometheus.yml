# Private inside API network namespace. Scrapes only Theia Go loopback.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: theia-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          service: theia-api
          environment: local
