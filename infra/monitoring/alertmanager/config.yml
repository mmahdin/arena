# MON-02: local synthetic alerts ONLY. No credentials and no external paging.
# Labels/annotations come exclusively from code-owned Prometheus rules.
global:
  resolve_timeout: 2m
  smtp_smarthost: mailpit:1025
  smtp_from: theia-monitor@theia.invalid
  smtp_require_tls: false
route:
  receiver: theia-local-inbox
  group_by: [alertname, severity]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: theia-local-inbox
      group_interval: 1m
      repeat_interval: 1h
receivers:
  - name: theia-local-inbox
    email_configs:
      - to: theia-alerts@theia.invalid
        send_resolved: true
        headers:
          Subject: '[Theia][{{ .Status }}] {{ .CommonLabels.alertname }}'
        html: '{{ template "email.default.html" . }}'
