# OBS-05A: PRIVATE/local synthetic-only AI traces (never share with metrics/logs).
# One OTLP receiver, two independent authenticated OTLP/HTTP exporters.
# The Go API sends exactly one trace; neither collector branch reinvokes AI.
extensions:
  bearertokenauth/theia:
    token: ${env:THEIA_COLLECTOR_INGEST_KEY}

receivers:
  otlp/theia:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth/theia

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 32
    send_batch_max_size: 64

exporters:
  otlphttp/phoenix:
    endpoint: http://phoenix:6006
    headers:
      Authorization: "Bearer ${env:THEIA_PHOENIX_API_KEY}"
      x-project-name: theia-obs05a-dual
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 512
  otlphttp/langfuse:
    endpoint: ${env:THEIA_LANGFUSE_OTLP_ENDPOINT}
    headers:
      Authorization: "Basic ${env:THEIA_LANGFUSE_AUTH_BASE64}"
      x-langfuse-ingestion-version: "4"
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 512

service:
  extensions: [bearertokenauth/theia]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces/theia_dual:
      receivers: [otlp/theia]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/phoenix, otlphttp/langfuse]
