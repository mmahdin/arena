# INTERNAL synthetic-data development only. Expose no ports beyond host loopback.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set strong local MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - wellbeing_mssql:/var/opt/mssql
  migrate:
    build: .
    command: ["/app/migrate"]
    environment:
      APP_ENV: local
      MSSQL_AUTO_CREATE_DATABASE: "true"
      DATABASE_URL: "sqlserver://sa:${MSSQL_SA_PASSWORD}@mssql:1433?database=wellbeing&encrypt=disable"
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      mssql: {condition: service_started}
    restart: "no"
  api:
    build: .
    command: ["/app/api"]
    environment:
      APP_ENV: local
      ALLOW_DEV_LOGIN: "true"
      DEV_SESSION_SECRET: ${DEV_SESSION_SECRET:?set DEV_SESSION_SECRET in .env}
      DATABASE_URL: "sqlserver://sa:${MSSQL_SA_PASSWORD}@mssql:1433?database=wellbeing&encrypt=disable"
      HTTP_ADDR: "0.0.0.0:8080"
      APP_ALLOWED_ORIGIN: ${APP_ALLOWED_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: "false"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-https://api.openai.com/v1}
      MODEL_NAME: ${MODEL_NAME:-configure-me}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-35}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-700}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-16000}
      MAX_CONTEXT_MESSAGES: ${MAX_CONTEXT_MESSAGES:-20}
      # WP-09 retrieval embedding tier: offline deterministic default (no network call).
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-deterministic-test-embed}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-128}
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  wellbeing_mssql:
