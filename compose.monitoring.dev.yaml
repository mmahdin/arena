# MON-01A: ONLY for local synthetic Compose. Always layer over compose.yaml.
# Prometheus shares the API network namespace exclusively to scrape a private
# 127.0.0.1:9100 listener. No /metrics route or host metrics port exists.
services:
  api:
    environment:
      THEIA_METRICS_ENABLED: "true"
      THEIA_METRICS_ADDR: "127.0.0.1:9100"

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.16.0
    network_mode: "service:api"
    depends_on:
      api: {condition: service_started}
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - theia_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.listen-address=0.0.0.0:9090
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.3.0
    depends_on:
      prometheus: {condition: service_started}
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: ${THEIA_GRAFANA_ADMIN_PASSWORD:?Run python3 scripts/monitoring/init_local_monitoring_env.py}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: "http://127.0.0.1:3000/"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - theia_grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  theia_prometheus_data:
  theia_grafana_data:
