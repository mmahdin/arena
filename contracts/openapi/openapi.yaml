  /api/v1/conversations/{id}/turns:
    parameters:
    - $ref: '#/components/parameters/ConversationID'
    post:
      operationId: processAICoreTurn
      description: Non-streaming AI Core turn. User input is durable before inference; only validated output commits with
        state/jobs/trace. Completed duplicates replay without inference. Same key with changed normalized message or request
        metadata returns 409. Queued/running returns 202; terminal failed/cancelled duplicates return 200 with their status.
        Explicit retry is separate. Wake-up/origin/userId fields are forbidden. Requires completed onboarding.
        Sending a user turn authorizes AI chat; no separate chat-consent flag is checked.
      security:
      - userSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResult'
        '400': *id001
        '401': *id001
        '404': *id001
        '409': *id001
        '413': *id001
        '415': *id001
        '429': *id001
        '503': *id001
        '202': &id003
          description: Durably admitted or in flight; poll status and explicitly recover the user FIFO queue.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResult'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnInput'
  /api/v1/conversations/{id}/turns/{clientTurnId}:
    parameters: &id002
    - $ref: '#/components/parameters/ConversationID'
    - name: clientTurnId
      in: path
      required: true
      schema: &id004
        $ref: '#/components/schemas/UUID'
    get:
      operationId: getAICoreTurn
      description: Owner- and conversation-scoped status/replay. Pure read; never invokes a model. Hidden conversations/messages
        return 404.
      security:
      - userSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResult'
        '400': *id001
        '401': *id001
        '404': *id001
        '409': *id001
        '413': *id001
        '415': *id001
        '429': *id001
        '503': *id001
  /api/v1/conversations/{id}/turns/{clientTurnId}/retry:
    parameters: *id002
    post:
      operationId: retryAICoreTurn
      description: Explicitly requeue a failed/cancelled turn using its original stored request. Repeated queued/running/completed
        requests return current status. No body; call recover next to process FIFO. No separate chat-consent flag is checked.
      security:
      - userSession: []
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResult'
        '400': *id001
        '401': *id001
        '404': *id001
        '409': *id001
        '413': *id001
        '415': *id001
        '429': *id001
        '503': *id001
  /api/v1/me/ai/recover:
    post:
      operationId: recoverAICoreTurn
      description: Process the oldest visible queued/running turn for the authenticated user from persisted metadata; never
        fabricates or accepts user messages. A live lease returns 202. No separate chat-consent flag is checked.
      security:
      - userSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResult'
        '400': *id001
        '401': *id001
        '404': *id001
        '409': *id001
        '413': *id001
        '415': *id001
        '429': *id001
        '503': *id001
        '202': *id003
  /api/v1/me/ai/controls:
    get:
      operationId: getAIControls
