  /api/v1/me/onboarding-progress:
    get:
      operationId: getOnboardingProgress
      security:
      - userSession: []
      description: Read the furthest reached illustrated onboarding screen for the current session. No questionnaire answers
        are stored.
      responses:
        '200':
          description: Saved route cursor, indexed by Hamrah v1 onboarding flow (0..23)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingProgress'
