    post:
      operationId: correctMemory
      description: Explicit contest/rejection through Memory Committer, with audit/provenance and hypothesis cooldown. Memory is always enabled.
      security:
      - userSession: []
      responses:
        '204':
          description: Success — visibility change only; original data retained
        '400': *id001
        '401': *id001
        '404': *id001
        '409': *id001
        '413': *id001
        '415': *id001
        '429': *id001
        '503': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionInput'
  /api/v1/messages/{messageId}:
    parameters:
    - name: messageId
      in: path
      required: true
      schema: *id004
    delete:
      operationId: hideMessage
      description: Soft-hide one visible owner message. Retain text/evidence and derived state; no recursive deletion.
      security:
      - userSession: []
      responses:
        '204':
          description: Success — visibility change only; original data retained
        '400': *id001
        '401': *id001
        '404': *id001
        '409': *id001
        '413': *id001
        '415': *id001
        '429': *id001
        '503': *id001
      parameters:
      - *id005
  /api/v1/me/ai/export:
    get:
      operationId: exportAIData
      description: Paginated export of visible owner messages, memories or controls. No trace prompts, hidden records or third-party
        data are exposed. This is a scoped product export, not legal erasure or a complete retained account archive.
      security:
      - userSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIExport'
        '400': *id001
        '401': *id001
        '404': *id001
        '409': *id001
        '413': *id001
        '415': *id001
        '429': *id001
        '503': *id001
