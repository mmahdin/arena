      - userSession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIControls'
        '400': *id001
        '401': *id001
        '404': *id001
        '409': *id001
        '413': *id001
        '415': *id001
        '429': *id001
        '503': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIControlInput'
  /api/v1/me/memories:
