      type: object
      additionalProperties: false
      description: Explicit self-reported answers only, never inferred traits. All fields optional. Maximum 4000 Unicode characters
        in serialized JSON; reject control and direction-override characters. Mood is an onboarding snapshot, not a current
        assessment. Voice, referrals and notification preferences are not model context.
      properties:
        age:
          type: string
          maxLength: 200
        identity:
          type: string
          enum:
          - زن
          - مرد
          - تمایل ندارم بگم
        therapist:
          type: string
          maxLength: 200
        faith:
          type: string
          maxLength: 200
        neurodivergent:
          type: string
          maxLength: 200
        mood:
          type: integer
          minimum: 0
          maximum: 4
        concerns:
          $ref: '#/components/schemas/OnboardingSelections'
        focus:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
        feelings:
          $ref: '#/components/schemas/OnboardingSelections'
        relationships:
          $ref: '#/components/schemas/OnboardingSelections'
        interests:
