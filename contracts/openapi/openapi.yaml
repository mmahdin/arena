      operationId: advanceOnboardingProgress
      security:
      - userSession: []
      description: Only current session owner. Cursor can advance exactly one index at a time; previously reached indices
        are idempotent and do not lower progress. Completion still occurs exclusively through PATCH /me/profile. The API never
        accepts answers.
