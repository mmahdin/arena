openapi: 3.1.0
info:
  title: Wellbeing Internal MVP API
  version: 0.3.0
  description: Internal synthetic-data API. WP-16 replaces the experimental turn response and removes AI-status/Daily Reflection
    routes. JSON-only, no SSE, Proactive Wake-up disabled. Not approved for real mental-health use.
servers:
- url: http://127.0.0.1:8080
paths:
  # AUTH-03: OIDC browser/BFF endpoints. Disabled by default (503) until
  # AUTH_BFF_ENABLED=true and the particular realm login flag is enabled.
  # Only exact configured app/admin hosts can use their respective endpoints.
  /auth/user/login:
    get:
      operationId: beginUserOIDCLogin
      summary: Begin user OIDC Authorization Code + PKCE (opt-in after SMS-only flow verification)
      parameters:
        - in: query
          name: return_to
          required: false
          description: Optional same-origin path (at most 1024 characters) sealed into the one-time OIDC transaction. Absolute/protocol-relative URLs, dot segments, backslashes, fragments and ambiguous encodings are rejected. Defaults to /.
          schema:
            type: string
            maxLength: 1024
            example: /onboarding
      responses:
        '302':
          description: Redirect to user-realm authorization endpoint; sets short-lived HttpOnly login cookie
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/user/callback:
    get:
      operationId: completeUserOIDCCallback
      summary: Verify state, PKCE, signed SMS proof and resolve/create User session
      responses:
        '303':
          description: Host-bound session cookie; 303 Location is the validated, transaction-bound return_to path or /
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/user/session:
    get:
      operationId: inspectUserAppSession
      summary: Same-origin, no-store User session and CSRF token (never OAuth tokens)
      responses:
        '200':
          description: Active user session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/user/logout:
    post:
      operationId: revokeUserAppSession
      summary: Revoke current Theia application session only; use /logout/sso for browser SSO handoff
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Session revoked and cookie removed
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/staff/login:
    get:
      operationId: beginStaffOIDCLogin
      summary: Begin staff OIDC login (disabled until AUTH-04 provisioning)
      parameters:
        - in: query
          name: return_to
          required: false
          description: Optional same-origin path (at most 1024 characters) sealed into the one-time OIDC transaction. Absolute/protocol-relative URLs, dot segments, backslashes, fragments and ambiguous encodings are rejected. Defaults to /.
          schema:
            type: string
            maxLength: 1024
            example: /onboarding
      responses:
        '302':
          description: Redirect to staff-realm authorization endpoint
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/staff/callback:
    get:
      operationId: completeStaffOIDCCallback
      summary: Verify staff identity and pre-provisioned active staff account
      responses:
        '303':
          description: Staff session cookie; 303 Location is the validated, transaction-bound return_to path or /
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/staff/session:
    get:
      operationId: inspectStaffAppSession
      summary: Same-origin, no-store Staff session, fixed admin role and CSRF token
      responses:
        '200':
          description: Active staff admin session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/staff/logout:
    post:
      operationId: revokeStaffAppSession
      summary: Revoke current Staff application session only; use /logout/sso for browser SSO handoff
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Session revoked and cookie removed
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  # AUTH-08: SSO handoff and all-device Theia session revocation. Requires
  # the existing same-origin Staff/User session cookie + CSRF token.
  /auth/user/logout/sso:
    post:
      operationId: logoutUserSSO
      summary: Revoke current Theia session(s) and return fixed browser Keycloak logout URL
      description: Browser MUST navigate to logoutUrl. Without id_token_hint Keycloak may ask for confirmation. logout-all does not revoke other Keycloak SSO sessions on remote devices.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Theia sessions revoked; browser SSO handoff required
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [logoutUrl, theiaSessionsRevoked, keycloakSSOStatus]
                properties:
                  logoutUrl: {type: string, format: uri}
                  theiaSessionsRevoked: {type: string, enum: [current, all]}
                  keycloakSSOStatus: {type: string, enum: [browser_action_required]}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/user/logout-all:
    post:
      operationId: revokeAllUserSessions
      summary: Revoke all Theia session(s) and return fixed browser Keycloak logout URL
      description: Browser MUST navigate to logoutUrl. Without id_token_hint Keycloak may ask for confirmation. logout-all does not revoke other Keycloak SSO sessions on remote devices.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Theia sessions revoked; browser SSO handoff required
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [logoutUrl, theiaSessionsRevoked, keycloakSSOStatus]
                properties:
                  logoutUrl: {type: string, format: uri}
                  theiaSessionsRevoked: {type: string, enum: [current, all]}
                  keycloakSSOStatus: {type: string, enum: [browser_action_required]}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/user/backchannel-logout:
    post:
      operationId: receiveUserBackchannelLogout
      summary: Receive and verify a signed, realm-bound OIDC back-channel logout_token
      description: Private server-to-server callback. JWT RS256, issuer, audience, events, iat, exp and jti are validated. Replay-safe SQL transaction revokes matching sessions. No browser credentials or CSRF.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [logout_token]
              properties:
                logout_token: {type: string, maxLength: 16384}
      responses:
        '200': {description: Logout applied or safe duplicate}
        '400': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/staff/logout/sso:
    post:
      operationId: logoutStaffSSO
      summary: Revoke current Theia session(s) and return fixed browser Keycloak logout URL
      description: Browser MUST navigate to logoutUrl. Without id_token_hint Keycloak may ask for confirmation. logout-all does not revoke other Keycloak SSO sessions on remote devices.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Theia sessions revoked; browser SSO handoff required
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [logoutUrl, theiaSessionsRevoked, keycloakSSOStatus]
                properties:
                  logoutUrl: {type: string, format: uri}
                  theiaSessionsRevoked: {type: string, enum: [current, all]}
                  keycloakSSOStatus: {type: string, enum: [browser_action_required]}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/staff/logout-all:
    post:
      operationId: revokeAllStaffSessions
      summary: Revoke all Theia session(s) and return fixed browser Keycloak logout URL
      description: Browser MUST navigate to logoutUrl. Without id_token_hint Keycloak may ask for confirmation. logout-all does not revoke other Keycloak SSO sessions on remote devices.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Theia sessions revoked; browser SSO handoff required
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [logoutUrl, theiaSessionsRevoked, keycloakSSOStatus]
                properties:
                  logoutUrl: {type: string, format: uri}
                  theiaSessionsRevoked: {type: string, enum: [current, all]}
                  keycloakSSOStatus: {type: string, enum: [browser_action_required]}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/staff/backchannel-logout:
    post:
      operationId: receiveStaffBackchannelLogout
      summary: Receive and verify a signed, realm-bound OIDC back-channel logout_token
      description: Private server-to-server callback. JWT RS256, issuer, audience, events, iat, exp and jti are validated. Replay-safe SQL transaction revokes matching sessions. No browser credentials or CSRF.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [logout_token]
              properties:
                logout_token: {type: string, maxLength: 16384}
      responses:
        '200': {description: Logout applied or safe duplicate}
        '400': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # AUTH-07 local-only opt-in browser smoke test, not part of public UI.
  # Absent (404) unless AUTH_BROWSER_SMOKE_ENABLED=true with local BFF.
  /__auth-smoke/user:
    get:
      operationId: getLocalUserAuthSmoke
      summary: LOCAL ONLY - synthetic user browser/session smoke page
      responses:
        '200': {description: Static HTML with restrictive CSP and same-origin JS}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /__auth-smoke/staff:
    get:
      operationId: getLocalStaffAuthSmoke
      summary: LOCAL ONLY - synthetic staff browser/session smoke page
      responses:
        '200': {description: Static HTML with restrictive CSP and same-origin JS}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /__auth-smoke/smoke.js:
    get:
      operationId: getLocalAuthSmokeScript
      summary: LOCAL ONLY - read-only same-origin browser smoke JS
      responses:
        '200': {description: Static JavaScript with no tokens or private data}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Liveness OK
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: SQL Server available
        '503':
          $ref: '#/components/responses/Problem'
  # AUTH-09: /api/v1/dev/* has been permanently removed.
  # Admin endpoints require Staff BFF; product endpoints require User BFF.
  /api/v1/admin/me:
    get:
      operationId: getCurrentAdmin
      summary: Get authenticated, pre-provisioned and active Staff Admin
      description: >-
        Requires an active SQL-backed Staff BFF session from the theia-staff
        Keycloak realm on the configured Admin origin. A single fixed admin
        role has access to all implemented Back-Office capabilities. This
        endpoint exposes no user data or Keycloak credentials.
      security:
      - staffSession: []
      responses:
        '200':
          description: Verified Staff Admin identity and application session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMe'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  # BO-03: authenticated admin audit, append-only and metadata-only.
  /api/v1/admin/audit:
    get:
      operationId: listAdminAudit
      summary: Query bounded, immutable administrative audit metadata
      description: >-
        Requires verified active staff session. Each authorized read is audited
        before returning data. No credentials, requests, prompts, messages or
        contact identifiers are stored or returned. Times are UTC, to is exclusive.
      security:
      - staffSession: []
      parameters:
      - name: from
        in: query
        schema: {type: string, format: date-time}
        description: UTC lower inclusive bound; defaults to last 24 hours when both bounds omitted.
      - name: to
        in: query
        schema: {type: string, format: date-time}
        description: UTC upper exclusive bound; must be provided with from.
      - name: cursor
        in: query
        schema: {type: string, maxLength: 180}
      - name: pageSize
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      - name: actorStaffId
        in: query
        schema: {$ref: '#/components/schemas/UUID'}
      - name: actionCode
        in: query
        schema: {type: string, maxLength: 48}
      responses:
        '200':
          description: Metadata-only audit events in newest-first order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminAuditPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # BO-05: durable metadata-only operational overview. Worker/job counts are
  # current snapshots; turn/LLM/stage metrics are bounded by admission/event time.
  /api/v1/admin/overview:
    get:
      operationId: getAdminOverview
      summary: Get bounded, audited operational health and usage aggregates
      description: >-
        Requires a verified active Staff Admin session. Counts current states of
        v1 turns admitted within [from,to); excludes legacy turns from rates.
        P95 is measured created_at-to-completed_at elapsed time for completed
        v1 turns (includes queue delay). Job counts are current, worker status
        derives from 45-second heartbeat freshness. Provider costs are configured
        estimates, not invoices. Missing evidence is null/warned, never zeroed.
      security:
      - staffSession: []
      parameters:
      - name: from
        in: query
        schema: {type: string, format: date-time}
        description: Inclusive RFC3339 lower bound. Both bounds omitted defaults to last 24 hours.
      - name: to
        in: query
        schema: {type: string, format: date-time}
        description: Exclusive RFC3339 upper bound; at most 31 days after from and not in future.
      responses:
        '200':
          description: Metadata-only operational snapshot, with explicit nulls and warnings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOverview'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # BO-06: metadata-only diagnostics; all reads are audited, never raw trace replay.
  /api/v1/admin/turns:
    get:
      operationId: listAdminTurns
      summary: List bounded v1 turn lifecycle metadata
      security:
      - staffSession: []
      parameters:
      - {$ref: '#/components/parameters/AdminInspectorFrom'}
      - {$ref: '#/components/parameters/AdminInspectorTo'}
      - {$ref: '#/components/parameters/AdminInspectorCursor'}
      - {$ref: '#/components/parameters/AdminInspectorPageSize'}
      - name: status
        in: query
        schema: {type: string, enum: [queued, running, completed, failed, cancelled]}
      responses:
        '200':
          description: Metadata-only turns created within window, current states, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTurnPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/turns/{turnId}:
    get:
      operationId: getAdminTurnDetail
      summary: Bounded best-effort diagnostic metadata for one v1 turn
      description: >-
        This is not complete trace replay. Does not return messages, user IDs,
        private request/response JSON, job payloads or local Inspector files.
      security:
      - staffSession: []
      parameters:
      - name: turnId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/UUID'}
      responses:
        '200':
          description: Current turn and capped stage, provider and related-job metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTurnDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/turns/{turnId}/trace-references:
    get:
      operationId: listAdminTurnTraceReferences
      summary: Audited bounded W3C OTel root trace references for one admitted Turn
      description: >-
        Metadata only. Does not return prompt/response content, encrypted traces,
        user identifiers, local Inspector file IDs/paths or Phoenix URLs.
        A valid Turn without persisted refs returns items: []. An absent Turn
        returns 404. Ref persistence and OTLP delivery are best-effort and
        independent; a reference does not prove Phoenix received that trace.
      security:
      - staffSession: []
      parameters:
      - name: turnId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/UUID'}
      - name: pageSize
        in: query
        schema: {type: integer, minimum: 1, maximum: 50, default: 25}
      - name: cursor
        in: query
        schema: {type: string, minLength: 1, maxLength: 180}
      responses:
        '200':
          description: Metadata-only root references; newest first, with opaque cursor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTraceReferencePage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/jobs:
    get:
      operationId: listAdminJobs
      summary: List bounded AI worker-job metadata
      security:
      - staffSession: []
      parameters:
      - {$ref: '#/components/parameters/AdminInspectorFrom'}
      - {$ref: '#/components/parameters/AdminInspectorTo'}
      - {$ref: '#/components/parameters/AdminInspectorCursor'}
      - {$ref: '#/components/parameters/AdminInspectorPageSize'}
      - name: status
        in: query
        schema: {type: string, enum: [queued, running, completed, failed, cancelled]}
      - name: kind
        in: query
        schema: {type: string, enum: [memory_write, memory_embed, memory_feedback, memory_maintain, reflection]}
      responses:
        '200':
          description: Job metadata only (no worker lease tokens, payloads or user identifiers)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminJobPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/workers:
    get:
      operationId: listAdminWorkers
      summary: Worker instance heartbeat diagnostics (last 7 days, capped)
      security:
      - staffSession: []
      responses:
        '200':
          description: Liveness evidence, not confirmation of job progress
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminWorkerPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # BO-09: read-only startup snapshot of deployed Knowledge, not a release catalog.
  /api/v1/admin/bundles:
    get:
      operationId: listAdminKnowledgeBundles
      summary: Inspect signed deployed bundle and explicitly configured read-only candidates
      description: >-
        Staff-only, audited. Snapshot captured at API startup; no request may
        select a path or publish/reload a bundle. A release signature proves
        integrity with a configured key, not independent clinical approval.
        Candidate validation failures are sanitized to stable codes only.
      security: [{staffSession: []}]
      responses:
        '200':
          description: Startup-only inventory; active may be null and candidates may be empty
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminBundleInventory'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # BO-08: audited, synthetic-only WP-15 evaluation reports (no raw observations).
  /api/v1/admin/evaluations:
    get:
      operationId: listAdminEvaluations
      summary: List validated synthetic evaluation run metadata
      security: [{staffSession: []}]
      parameters:
      - {$ref: '#/components/parameters/AdminInspectorFrom'}
      - {$ref: '#/components/parameters/AdminInspectorTo'}
      - {$ref: '#/components/parameters/AdminInspectorCursor'}
      - {$ref: '#/components/parameters/AdminInspectorPageSize'}
      - name: status
        in: query
        schema: {type: string, enum: [passed, failed, blocked]}
      responses:
        '200':
          description: Bounded run metadata; no clinical/runner attestation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEvalPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/evaluations/{runId}:
    get:
      operationId: getAdminEvaluation
      summary: Read validated redacted WP-15 report and recomputed baseline regressions
      security: [{staffSession: []}]
      parameters:
      - name: runId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/UUID'}
      responses:
        '200':
          description: Verified artifact checksum; report origin and clinical review remain unattested
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEvalDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/evaluations/import:
    post:
      operationId: importAdminEvaluation
      summary: Idempotently store raw eval_report.v1 JSON with byte SHA-256 verification
      description: >-
        Staff-only, Origin and session CSRF guarded. Upload original WP-15 report bytes,
        not a wrapper. X-Eval-SHA256 is computed over those exact bytes, not a
        runner signature. Imported records are never marked clinically approved,
        runner-attested or verified fixture executions. No arbitrary command execution.
      security: [{staffSession: []}]
      parameters:
      - name: X-Eval-SHA256
        in: header
        required: true
        schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      - name: X-CSRF-Token
        in: header
        required: true
        schema: {type: string}
      - name: baselineRunId
        in: query
        schema: {$ref: '#/components/schemas/UUID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminEvalReport'}
      responses:
        '201':
          description: Immutable report imported
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEvalRun'}
        '200':
          description: Identical artifact and baseline already imported (idempotent)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEvalRun'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
