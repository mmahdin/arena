        in: query
        required: true
        schema:
          type: string
          enum:
          - messages
          - memories
          - controls
components:
  securitySchemes:
    userSession:
      type: apiKey
      in: cookie
      name: __Host-theia_user_session
      description: HTTPS BFF session; local-only HTTP uses theia_user_session_local. Not a JWT.
    staffSession:
      type: apiKey
      in: cookie
      name: __Host-theia_staff_session
      description: HTTPS staff BFF session; local-only HTTP uses theia_staff_session_local.
  parameters:
    AdminInspectorFrom:
      name: from
      in: query
      schema: {type: string, format: date-time}
      description: Inclusive creation time (UTC); both from/to omitted defaults to past 24 hours.
    AdminInspectorTo:
      name: to
      in: query
      schema: {type: string, format: date-time}
      description: Exclusive creation time, max window 31 days, cannot be future.
    AdminInspectorCursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 180}
      description: Opaque keyset cursor; must be used with the same filters.
    AdminInspectorPageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    ConversationID:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
  responses:
    Problem:
      description: Stable machine error, without private content
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AdminEvalTotals:
      type: object
