      description: Idempotent explicit control command. Only deployment-approved consent keys accepted. Memory is always enabled;
        memoryPaused is accepted for compatibility and ignored. Consent values do not gate ordinary memory use.
        Omitted fields are preserved; preferences, if supplied, replace the entire preferences object.
