<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theia AI Execution Explorer</title>
<style>
/* ===== theme ===== */
:root{--bg:#0c0f16;--pn:#141925;--p2:#1b2231;--bd:#2a3347;--tx:#e8ecf4;--mu:#8e9ab1;--ac:#7c9cff;--ok:#3ecf8e;--er:#ff5d6c;--sk:#8e9ab1;--rn:#f5b84a;--cn:#c084fc;--wn:#f5b84a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit;background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;max-width:100%}
button,select{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}button:disabled:hover{border-color:var(--bd)}
button:hover{border-color:var(--ac)}
button[aria-pressed=true],button.on{background:var(--ac);color:#0b1020;border-color:var(--ac)}
button:focus-visible,.nd:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,.wr:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
a.ch,.cr a{color:var(--ac);cursor:pointer;text-decoration:none}a.ch:hover,.cr a:hover{text-decoration:underline}
code{font:11.5px ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.mu,.nt{color:var(--mu);font-size:11px}i.nl{color:var(--mu)}

/* ===== header ===== */
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{font-weight:700}.logo span{color:var(--mu);font-weight:500}.sp{flex:1}
#sel{max-width:260px}
#find{width:170px;padding:5px 9px}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:8px 0 0 8px;margin:0}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.zero{opacity:.6}
#metaBar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:5px 12px;background:var(--pn);border-bottom:1px solid var(--bd);font-size:12px;color:var(--mu)}
#metaBar:empty{display:none}
.chip{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--bd);border-radius:99px;padding:0 9px;line-height:20px;background:var(--p2);color:var(--tx);font-size:11.5px}
button.chip{cursor:pointer}.chip.er{border-color:var(--er);color:var(--er)}.chip.wn{border-color:var(--wn);color:var(--wn)}.chip.ok{border-color:var(--ok);color:var(--ok)}

/* ===== canvas ===== */
main{flex:1;display:flex;min-height:0;position:relative}
#view{flex:1;position:relative;overflow:hidden;cursor:grab;background:radial-gradient(circle at 1px 1px,#222b3d 1px,transparent 0) 0 0/24px 24px;touch-action:none}
#view,#view *{-webkit-user-select:none;user-select:none}
#view.pan,#view.pan *{cursor:grabbing!important}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
.ex{stroke:#3a4660;fill:none;stroke-width:1.5}
.dt{fill:none;stroke-width:2;opacity:.92}.dt.tr{stroke:#b388ff}.dt.cp{stroke:#5ec2ff}.dt.rg{stroke:#ffa94d;stroke-width:3}.dt.mt{stroke:#7d889e;stroke-dasharray:5 4}
.st-success{--c:var(--ok)}.st-error{--c:var(--er)}.st-skipped{--c:var(--sk)}.st-running{--c:var(--rn)}.st-cancelled{--c:var(--cn)}.st-unknown{--c:#c9a227}
.nd{position:absolute;width:252px;height:64px;padding:8px 42px 6px 12px;background:var(--pn);border:1px solid var(--bd);border-left:4px solid var(--c,#667);border-radius:10px;box-shadow:0 2px 10px #0006;cursor:pointer;animation:in .2s}
.nd.st-error{background:#2a1620}
.nd.deg{box-shadow:0 2px 10px #0006,inset 0 0 0 1px #f5b84a66}
.nd.st-skipped{border-style:dashed;border-left-style:solid;opacity:.85}
.nd.sel{box-shadow:0 0 0 2px var(--ac),0 6px 24px #0008}
.nd b{display:block;font-size:12px;line-height:15px;max-height:30px;overflow:hidden;overflow-wrap:anywhere}
.nd small{display:block;color:var(--mu);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.nd .bg{position:absolute;right:6px;top:3px;display:flex;gap:3px}
.pl{font-size:10px;line-height:14px;padding:0 5px;border-radius:99px;background:#0006;border:1px solid currentColor;white-space:nowrap}
.pl.er{color:var(--er)}.pl.wn{color:var(--wn)}
.cv{position:absolute;right:8px;top:50%;margin-top:-10px;width:26px;height:26px;padding:0;border-radius:50%;font-size:11px}
@keyframes in{from{opacity:0}}
#zc{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;z-index:3}#zc span{color:var(--mu);font-size:11px;min-width:38px}
#nomatch{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mu);pointer-events:none;z-index:1;text-align:center;padding:20px}
#hint{position:absolute;right:12px;bottom:10px;color:var(--mu);font-size:11px;pointer-events:none;text-align:right;max-width:60%}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;color:var(--mu);padding:20px;z-index:2}#empty h2{color:var(--tx);margin:0}
body.drop #view{outline:3px dashed var(--ac);outline-offset:-8px}

/* ===== inspector ===== */
#insp{width:500px;max-width:50%;background:var(--pn);border-left:1px solid var(--bd);display:none;flex-direction:column;min-width:0}
body.has.ip #insp{display:flex}
#ih{padding:10px 14px 6px;border-bottom:1px solid var(--bd)}
#ih .row{display:flex;gap:8px;align-items:flex-start}#ih h3{margin:0;font-size:14px;overflow-wrap:anywhere;flex:1}
.hb{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.hb button{font-size:11px;padding:2px 8px}
.x{padding:0 8px;line-height:22px}
.cr{color:var(--mu);font-size:11px;margin-bottom:3px;overflow-wrap:anywhere}
#tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--bd);overflow-x:auto}
#tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;white-space:nowrap}
#tabs button.on{border-color:var(--ac);color:var(--ac);background:none}
#tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px;background:var(--er)}#tabs .dot.w{background:var(--wn)}
#ib{flex:1;overflow:auto;padding:12px 14px 30px;min-height:0}
#ib h4{margin:16px 0 6px;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}#ib h4:first-child{margin-top:0}
.trw{display:flex;flex-direction:column;gap:3px}
.kv{display:flex;gap:10px;align-items:baseline}.kv>.k{flex:0 0 auto;min-width:90px;max-width:40%;color:var(--mu);overflow-wrap:anywhere}.vv{min-width:0;flex:1;overflow-wrap:anywhere}
details{margin:2px 0}summary{cursor:pointer;list-style:none;color:var(--mu)}summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";display:inline-block;width:1em}details[open]>summary::before{content:"▾ "}summary em{font-size:11px;margin-left:6px}
details>div{margin-left:5px;border-left:1px solid var(--bd);padding-left:10px}
.tb{position:relative;margin:2px 0}
.tbt{position:absolute;right:6px;top:6px;display:flex;gap:4px;opacity:0;transition:opacity .12s}
.tb:hover .tbt,.tb:focus-within .tbt{opacity:1}.tbt button{font-size:10.5px;padding:0 6px;background:#0f131ccc}
@media(hover:none){.tbt{opacity:1}}
.txt{white-space:pre-wrap;background:#0f131c;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;max-height:300px;overflow:auto;overflow-wrap:anywhere}
.txt.grown{max-height:none}
.pt{font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;max-height:420px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.bar button{font-size:11px;padding:2px 9px}
.bd{display:inline-block;padding:0 8px;border-radius:99px;background:var(--c,#445);color:#0b1020;font-size:11px;font-weight:600;line-height:18px}
.r-cp{--c:#5ec2ff}.r-tr{--c:#b388ff}.r-rg{--c:#ffa94d}.r-mt{--c:#7d889e;color:#fff}.fl{animation:fl 1.8s}@keyframes fl{0%,60%{background:#f5b84a55}}
.card{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--p2)}.card>.h,.card>summary>.h{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card>.h{margin-bottom:6px}
details.card>summary{color:var(--tx)}details.card>div{margin-top:6px}
.alert{border:1px solid var(--bd);border-left-width:4px;border-radius:8px;padding:8px 10px;margin:0 0 10px;background:var(--p2)}
.alert.er{border-color:var(--er);background:#2a1620}.alert.wn{border-color:var(--wn);background:#2a2314}.alert.ok{border-color:var(--ok);background:#12281f}.alert.in{border-color:var(--ac)}
.alert>b{display:block;margin-bottom:3px}
ul.il{margin:4px 0 0;padding:0;list-style:none}ul.il li{padding:2px 0 2px 16px;position:relative;overflow-wrap:anywhere}ul.il li::before{content:"•";position:absolute;left:4px}
ul.il li.er::before{content:"✕";color:var(--er);left:2px}ul.il li.wn::before{content:"⚠";color:var(--wn);left:0}ul.il li.in::before{content:"i";color:var(--mu);left:4px}
.cmp{background:#7c9cff12;box-shadow:0 0 0 1px #7c9cff30;border-radius:3px;cursor:pointer}.cmp.on,.ol.on{background:#f5b84a44}
.ol{cursor:pointer;display:block;text-align:left;width:100%;margin:1px 0;padding:2px 6px;border:0;background:none;border-radius:4px}
.pcinfo{margin-top:6px;font-size:12px}.pcinfo button{display:block;margin:3px 0;font-size:11px;text-align:left;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid var(--bd);padding:3px 6px;text-align:left}th{color:var(--mu);font-weight:500}
#ib table td:nth-child(n+4){white-space:nowrap}
tr.go{cursor:pointer}tr.go:hover td{background:#7c9cff14}
.df{display:block;text-align:left;margin:2px 0;width:100%;overflow-wrap:anywhere;font-size:11.5px}
.msg{border:1px solid var(--bd);border-radius:10px;margin:6px 0;overflow:hidden}.msg>.mh{display:flex;gap:6px;align-items:center;padding:3px 8px;background:#0f131c;font-size:11px;color:var(--mu)}.msg>.tb .txt{border:0;border-radius:0}
.msg.system{border-color:#5ec2ff55}.msg.user{border-color:#7c9cff66}.msg.assistant{border-color:#3ecf8e55}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:6px}
.stat{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:7px 10px;min-width:0}
.stat .sv{display:block;font-size:19px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}.stat .sl{display:block;color:var(--mu);font-size:11px}.stat .ss{display:block;color:var(--mu);font-size:10px;opacity:.85}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.att{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--bd);overflow-wrap:anywhere}.att.rt{color:var(--mu);font-size:11px;padding-left:20px}
.wf{display:flex;flex-direction:column}
.wr{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:8px;align-items:center;text-align:left;border-radius:4px;padding:1px 4px;width:100%;cursor:pointer}
.wtg{display:inline-block;width:1.3em;text-align:center;color:var(--mu);border-radius:3px;cursor:pointer}.wtg:hover{background:#7c9cff33;color:var(--tx)}.wtg.leaf{cursor:default;visibility:hidden}
.wr:hover,.wr.sel{background:#7c9cff1c}
.wn1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.wt{position:relative;height:10px;background:#0f131c;border-radius:3px}.wb{position:absolute;top:1px;bottom:1px;border-radius:2px;background:var(--c,#667);min-width:2px}
#toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-40px);background:#1b2231;border:1px solid var(--ac);padding:8px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;cursor:pointer}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast.er{background:#3a1620;border-color:var(--er)}
@media(max-width:820px){
 #insp{width:auto;position:absolute;left:0;right:0;bottom:0;height:56%;max-width:none;border-left:0;border-top:1px solid var(--bd);z-index:5;box-shadow:0 -8px 30px #000a}
 #hint{display:none}header{gap:6px;padding:6px 8px}#find{width:120px}
}
</style>
</head>
<body>
<header>
  <b class="logo">Theia <span>Execution Explorer</span></b>
  <select id="sel" aria-label="Trace" hidden></select>
  <button id="rm" title="Close the selected trace" aria-label="Close the selected trace" hidden>Close trace</button>
  <button id="open">Open traces…</button>
  <input id="file" type="file" accept=".json,application/json" multiple hidden>
  <input id="find" type="search" placeholder="Filter by name… ( / )" aria-label="Show only operations whose name contains this text" title="Show only operations whose name contains this text. Enter / N = next match, Esc = clear" autocomplete="off">
  <span id="fc" class="mu" aria-live="polite"></span>
  <span class="sp"></span>
  <div class="seg" id="flow" role="group" aria-label="Data flow edges">
    <button data-m="key" class="on" title="Explicit instrumented bindings only">Key transfers</button>
    <button data-m="sel" title="All data edges touching the selection">Selected</button>
    <button data-m="all" title="Every data edge, including value matches">All</button>
  </div>
  <div class="seg" role="group" aria-label="Tree expansion">
    <button id="expAll" title="Expand every operation (E)">Expand all</button>
    <button id="colAll" title="Collapse everything down to the root operation(s) (C)">Collapse all</button>
    <button id="prob" title="Expand only the paths that lead to errors or degraded operations (P)">Problems</button>
  </div>
  <button id="info" title="Trace summary: verdict, issues, LLM calls, timeline (S)" aria-pressed="false">Summary</button>
</header>
<div id="metaBar"></div>
<main>
  <div id="view">
    <div id="world"><svg id="svg"></svg><div id="nodes"></div></div>
    <div id="empty"><h2>Drop a local_ai_trace.v1 file</h2><div>Traces are read locally in your browser. Nothing is uploaded. You can also paste trace JSON with Ctrl/⌘+V.</div><button id="open2">Open trace files…</button></div>
    <div id="nomatch" hidden></div>
    <div id="zc"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="fit">Fit</button><span id="zp"></span></div>
    <div id="hint">Click ▸ to expand · Shift-click ▾ collapses a subtree · Alt-click ▸ expands one · Scroll to zoom · Drag to pan · Arrow keys navigate</div>
  </div>
  <aside id="insp" aria-label="Inspector"><div id="ih"></div><div id="tabs" role="tablist"></div><div id="ib"></div></aside>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   Theia AI Execution Explorer — standalone viewer for local_ai_trace.v1
   Sections: helpers · loading · analysis · graph · renderers · inspector
             · summary · events
   ===================================================================== */

// ---------- helpers
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isObj = v => v !== null && typeof v === 'object';
const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
const fd = n => { n = num(n); if (n === null) return '—'; n = Math.max(0, n);
  return n < 1e3 ? Math.round(n) + ' ns' : n < 1e6 ? (n / 1e3).toFixed(1) + ' µs' : n < 1e9 ? (n / 1e6).toFixed(n < 1e7 ? 2 : 1) + ' ms' : (n / 1e9).toFixed(2) + ' s'; };
const usd = u => num(u) === null ? '—' : u < 1000 ? u + ' µUSD' : '$' + (u / 1e6).toFixed(u < 1e4 ? 5 : 4);
const sn = o => String(o).split('/').pop();
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b || a + 's');
/** case-insensitive property getter; first matching name wins */
const ci = (o, ...names) => {
  if (!isObj(o) || Array.isArray(o)) return undefined;
  for (const nm of names) {
    if (nm in o) return o[nm];
    const k = Object.keys(o).find(k => k.toLowerCase() === nm.toLowerCase());
    if (k !== undefined) return o[k];
  }
  return undefined;
};
/** ISO-8601 (possibly nanosecond precision) -> milliseconds, with sub-ms fraction kept */
function tms(s) {
  if (typeof s !== 'string') return null;
  const t = Date.parse(s.replace(/(\.\d{3})\d+/, '$1'));
  if (isNaN(t)) return null;
  const f = /\.(\d+)/.exec(s);
  return t + (f && f[1].length > 3 ? Number('0.' + f[1].slice(3)) : 0);
}
const jp = p => String(p).replace(/~/g, '~0').replace(/\//g, '~1');
const ptr = (r, p) => { let c = r; for (const s of String(p).split('/').slice(1)) c = c[s.replace(/~1/g, '/').replace(/~0/g, '~')]; return c; };
const gp = (o, p) => { try { return ptr(o, p); } catch { return undefined; } };
const enc = new TextEncoder(), dcd = new TextDecoder(), fdcd = new TextDecoder('utf-8', { fatal: true });
const tryJ = s => { try { const j = JSON.parse(s); return j && typeof j === 'object' ? j : null; } catch { return null; } };
const json = v => { try { return JSON.stringify(v, null, 2); } catch { return String(v); } };
function b64(s) { // decode base64 that holds readable UTF-8 text, else null
  if (typeof s !== 'string' || s.length < 16 || s.length % 4 || !/^[A-Za-z0-9+/]+={0,2}$/.test(s) || /^[0-9a-f]+$/i.test(s)) return null;
  try { const t = fdcd.decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))); return /[\x00-\x08\x0e-\x1f]/.test(t) ? null : t; } catch { return null; }
}
function copyText(t) {
  const done = () => toast('Copied to clipboard');
  const fb = () => { const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch { toast('Copy failed', 'er'); } a.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, fb); else fb();
}
let toastT;
function toast(m, kind) {
  const t = $('#toast'); t.textContent = m; t.className = 'show' + (kind ? ' ' + kind : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), kind === 'er' ? 9000 : 2500);
}

const W = 252, H = 64, GX = 70, GY = 14, KNOWN = new Set(['success', 'error', 'skipped', 'running', 'cancelled']);
let TR = [], cur = null, mode = 'key', ipOpen = !matchMedia('(max-width:820px)').matches;
const isMobile = () => matchMedia('(max-width:820px)').matches;

// ---------- loading & normalisation
/** Make an untrusted trace safe to render. Never throws for merely sloppy data. */
function build(t, name) {
  if (!isObj(t) || Array.isArray(t)) throw Error('not a JSON object');
  if (!Array.isArray(t.nodes)) throw Error('no "nodes" array — not a local_ai_trace');
  const notes = [];
  if (t.schema !== 'local_ai_trace.v1') notes.push(t.schema ? `schema is “${t.schema}”, this viewer targets local_ai_trace.v1; rendering best-effort` : 'no "schema" field; assuming local_ai_trace.v1');
  t.edges = (Array.isArray(t.edges) ? t.edges : []).filter(e => isObj(e) && e.from != null && e.to != null);
  t.diagnostics = Array.isArray(t.diagnostics) ? t.diagnostics : (t.diagnostics ? [t.diagnostics] : []);
  const N = new Map(), roots = [], seenIds = new Set();
  t.nodes.forEach((n, i) => {
    if (!isObj(n) || Array.isArray(n)) { notes.push(`node #${i} is not an object; skipped`); return; }
    let id = n.id == null || n.id === '' ? 'node#' + i : String(n.id);
    if (n.id == null || n.id === '') notes.push(`node #${i} had no id; using “${id}”`);
    if (seenIds.has(id)) { const o = id; id = id + '~' + i; notes.push(`duplicate node id “${o}”; renamed second one to “${id}”`); }
    seenIds.add(id); n.id = id;
    n.operation = typeof n.operation === 'string' && n.operation ? n.operation : '(unnamed operation)';
    n.status = typeof n.status === 'string' && n.status ? n.status : 'unknown';
    n.sequence = num(n.sequence) ?? i;
    if (n.input === undefined) n.input = null;
    if (n.output === undefined) n.output = null;
    n.artifacts = (Array.isArray(n.artifacts) ? n.artifacts : []).filter(isObj).map(a => { a.kind = String(a.kind || 'artifact'); a.name = String(a.name || a.kind); a.sha256 = typeof a.sha256 === 'string' ? a.sha256 : ''; return a; });
    n.provider_usage = (Array.isArray(n.provider_usage) ? n.provider_usage : []).filter(isObj);
    n.estimates = (Array.isArray(n.estimates) ? n.estimates : []).filter(isObj).map(e => { e.source = String(e.source ?? ''); e.method = String(e.method ?? ''); return e; });
    N.set(id, { n, kids: [], p: null, dp: null, fk: [], fp: null, vis: false, x: 0, y: 0, issues: [], roll: { err: 0, warn: 0 }, _llm: undefined });
  });
  if (!N.size) throw Error('the trace contains no operations');

  return `<div class="wf" role="list">${shown.map(([o, d], i) => { const s = sp[i], col = c.wfCol.has(o.n.id); return `<div class="wr${cur.sel === o.n.id ? ' sel' : ''}" role="listitem" tabindex="0" data-go="${esc(o.n.id)}" title="${esc(o.n.operation + ' · ' + o.n.status + ' · ' + fd(o.n.duration_ns))}"><span class="wn1" style="padding-left:${d * 12}px">${o.kids.length ? `<span class="wtg" role="button" tabindex="0" data-wt="${esc(o.n.id)}" aria-expanded="${!col}" aria-label="${col ? 'Expand' : 'Collapse'} ${esc(sn(o.n.operation))} in timeline" title="${col ? 'Show' : 'Hide'} ${plural(o.kids.length, 'child operation')}">${col ? '▸' : '▾'}</span>` : '<span class="wtg leaf"></span>'}${esc(sn(o.n.operation))}${col ? ` <span class="mu">(+${plural(o.kids.length, 'child', 'children')} hidden)</span>` : ''}</span><span class="wt"><span class="wb st-${KNOWN.has(o.n.status) ? o.n.status : 'unknown'}" style="${s ? `left:${(s[0] / total * 100).toFixed(2)}%;width:${Math.max(.4, (s[1] - s[0]) / total * 100).toFixed(2)}%` : 'display:none'}"></span></span></div>`; }).join('')}${rows.length > shown.length ? `<div class="mu">…${rows.length - shown.length} more operations not drawn</div>` : ''}</div><div class="mu">Bars show wall-clock start/end relative to trace start; total ${fd(total * 1e6)}.</div>`;
}

// ---------- inspector shell
function insp() {
  const c = cur, ih = $('#ih'), tb = $('#tabs'), ib = $('#ib');
  $('#info').setAttribute('aria-pressed', String(ipOpen && !!c && !c.sel));
  if (!c) { ih.innerHTML = '<h3>Inspector</h3>'; tb.innerHTML = ib.innerHTML = ''; return; }
  const o = c.sel && c.N.get(c.sel), keep = ib.scrollTop;
  if (!o) {
    ih.innerHTML = '<div class="row"><h3>Trace summary</h3><button class="x" data-act="close" aria-label="Close inspector" title="Close (Esc)">×</button></div>'; tb.innerHTML = '';
    try { ib.innerHTML = summary(); } catch (e) { ib.innerHTML = `<div class="alert er"><b>Could not render the summary</b>${esc(e.message)}</div>`; }
    return;
  }
  const n = o.n, cr = []; for (let q = o.p; q; q = q.p) cr.unshift(`<a data-go="${esc(q.n.id)}">${esc(sn(q.n.operation))}</a>`);
  ih.innerHTML = `<div class="cr">${cr.join(' › ')}</div><div class="row"><h3>${esc(sn(n.operation))} <span class="bd st-${KNOWN.has(n.status) ? n.status : 'unknown'}">${esc(n.status)}</span></h3><div class="hb">${o.kids.length ? '<button data-act="subExp" title="Expand this operation and everything below it">Expand subtree</button><button data-act="subCol" title="Collapse this operation and everything below it">Collapse subtree</button>' : ''}<button data-act="copyNode" title="Copy this node as JSON">Copy node</button><button class="x" data-act="close" aria-label="Close inspector" title="Close (Esc)">×</button></div></div>`;
  const llm = isLLMNode(o), dn = c.t.edges.filter(e => e.kind === 'data' && (String(e.from) === n.id || String(e.to) === n.id)).length;
  const tabs = [['ov', 'Overview', n.status === 'error' ? 'dot' : isProblem(o) ? 'dot w' : ''], ...(llm ? [['llm', 'LLM', n.status === 'error' ? 'dot' : '']] : []), ['in', 'Input'], ['out', 'Output'], ['ar', 'Artifacts ' + n.artifacts.length], ['df', 'Data flow ' + dn]];
  if (!tabs.some(t => t[0] === c.tab)) c.tab = 'ov';
  tb.innerHTML = tabs.map(([k, l, d]) => `<button role="tab" aria-selected="${c.tab === k}" data-tab="${k}" class="${c.tab === k ? 'on' : ''}">${l}${d ? `<span class="${d}"></span>` : ''}</button>`).join('');
  const none = (v, w) => v === null || v === undefined ? `<p class="mu">No ${w} captured (${n.status === 'running' ? 'still running' : n.status === 'skipped' ? 'operation was skipped' : 'null in the trace'}).</p>` : '';
  const bar = (val, kind) => `<div class="bar"><button data-act="expandAll">Expand all</button><button data-act="collapseAll">Collapse all</button><button data-act="raw" aria-pressed="${c.raw}">Raw JSON</button><button data-act="copyJson" data-which="${kind}">Copy JSON</button></div>`;
  const pane = (val, kind, p) => c.raw ? bar(val, kind) + txt(json(val), 'pt') : bar(val, kind) + `<div data-p="${p}">${V(val, p)}</div>`;
  let html;
  try {
    html = c.tab === 'ov' ? OV(o) : c.tab === 'llm' ? LLM(o) : c.tab === 'in' ? none(n.input, 'input') || pane(n.input, 'in', '/input') : c.tab === 'out' ? none(n.output, 'output') || pane(n.output, 'out', '/output') : c.tab === 'df' ? DF(o) :
      !n.artifacts.length ? '<p class="mu">This operation captured no artifacts.</p> ' : bar(n.artifacts, 'ar') + (c.raw ? txt(json(n.artifacts), 'pt') : n.artifacts.map((a, i) => `<details class="card" ${n.artifacts.length <= 6 ? 'open' : ''} data-p="/artifacts/${i}"><summary><span class="h"><span class="bd" style="--c:hsl(${hue(a.kind)} 70% 72%)">${esc(a.kind)}</span><b>${esc(a.name)}</b>${a.source ? `<span class="mu">source label: ${esc(a.source)}</span>` : ''}${a.sha256 ? `<span class="mu">sha ${esc(a.sha256.slice(0, 8))}</span>` : ''}</span></summary><div data-p="/artifacts/${i}/value">${a.kind === 'prompt_composition' ? PC(o, i) : V(a.value, `/artifacts/${i}/value`)}</div></details>`).join(''));
  } catch (e) { html = `<div class="alert er"><b>Could not render this view</b>${esc(e.message)}</div>` + txt(json(n), 'pt'); }
  ib.innerHTML = html; ib.scrollTop = ib._k === n.id + c.tab ? keep : 0; ib._k = n.id + c.tab;
}
function openSummary(anchor) {
  if (!cur) return;
  cur.sel = null; paintSel(); setPanel(true); insp();
  if (anchor) { const el = $('#' + anchor, $('#ib')); if (el) el.scrollIntoView({ block: 'start' }); }
}

// ---------- filter (strictly by operation name)
function setHits(q, redraw = true) {
  const c = cur; if (!c) return; c.q = q; q = q.trim().toLowerCase();
  const was = c.filtering; c.filtering = !!q; c.hits = []; c.hi = -1;
  const walk = o => { if (!q || o.n.operation.toLowerCase().includes(q)) c.hits.push(o.n.id); o.kids.forEach(walk); };
  c.roots.forEach(walk); c.hitSet = new Set(c.hits);
  if (q) { // nearest matching ancestor becomes the display parent
    c.N.forEach(o => { o.fk = []; o.fp = null; }); c.fr = [];
    const link = (o, par) => { if (c.hitSet.has(o.n.id)) { o.fp = par; (par ? par.fk : c.fr).push(o); o.kids.forEach(k => link(k, o)); } else o.kids.forEach(k => link(k, par)); };
    c.roots.forEach(r => link(r, null));
  }
  $('#fc').textContent = q ? (c.hits.length ? plural(c.hits.length, 'matching operation') : 'no matches') : '';
  const nm = $('#nomatch'); nm.hidden = !(q && !c.hits.length); nm.textContent = q && !c.hits.length ? `No operation name contains “${c.q.trim()}”.` : '';
  for (const b of ['#expAll', '#colAll', '#prob']) { $(b).disabled = !!q; $(b).title = q ? 'Not available while filtering — clear the filter first' : { '#expAll': 'Expand every operation (E)', '#colAll': 'Collapse everything down to the root operation(s) (C)', '#prob': 'Expand only the paths that lead to errors or degraded operations (P)' }[b]; }
  if (!redraw) return;
  if (!was && c.filtering) c.vSaved = { ...c.v };
  draw();
  if (c.filtering) fit(); else if (was && c.vSaved) { c.v = c.vSaved; c.vSaved = null; apply(); }
}
function clearFilter() { $('#find').value = ''; setHits(''); }
function stepHit(d) {
  const c = cur; if (!c || !c.filtering || !c.hits.length) return;
  c.hi = (c.hi + d + c.hits.length) % c.hits.length;
  select(c.hits[c.hi], { reveal: true, open: ipOpen, force: true });
  $('#fc').textContent = `${c.hi + 1}/${c.hits.length}`;
}

// ---------- events
$('#nodes').addEventListener('click', e => {
  const d = e.target.closest('.nd'); if (!d) return; const id = d.dataset.id, cv = e.target.closest('.cv');
  if (cv) toggle(id, { deep: e.altKey || e.shiftKey, collapse: e.shiftKey && !e.altKey }); else select(id, { open: true, force: true });
});
$('#nodes').addEventListener('dblclick', e => { const d = e.target.closest('.nd'); if (d && !e.target.closest('.cv')) toggle(d.dataset.id); });
$('#nodes').addEventListener('keydown', e => {
  const d = e.target.closest('.nd'); if (!d || e.target.classList.contains('cv') || e.ctrlKey || e.metaKey || e.altKey) return;
  const o = cur.N.get(d.dataset.id); if (!o) return;
  const f = cur.filtering, par = f ? o.fp : o.p, kids = f ? o.fk : o.kids, sib = par ? (f ? par.fk : par.kids) : (f ? cur.fr : cur.roots), i = sib.indexOf(o), go = t => { if (t) { select(t.n.id, { reveal: true, open: false, force: true }); const f = nodeEl(t.n.id); f && f.focus({ preventScroll: true }); } };
  switch (e.key) {
    case 'Enter': select(o.n.id, { open: true, force: true }); if (o.kids.length && !f) toggle(o.n.id); break;
    case ' ': select(o.n.id, { open: true, force: true }); break;
    case 'ArrowDown': go(sib[i + 1]); break;
    case 'ArrowUp': go(sib[i - 1]); break;
    case 'ArrowRight': if (!f && o.kids.length && !cur.exp.has(o.n.id)) toggle(o.n.id); else go(kids[0]); break;
    case 'ArrowLeft': if (!f && cur.exp.has(o.n.id) && o.kids.length) toggle(o.n.id); else go(par); break;
    case '*': toggle(o.n.id, { deep: true }); break;
    default: return;
  }
  e.preventDefault();
});
const tabbed = el => { const t = el.dataset.tabto; return t ? { tab: t } : {}; };
$('#insp').addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-go],[data-nv],[data-k],[data-ol],[data-act],[data-wt]'); if (!t || !cur) return; const d = t.dataset, c = cur;
  if (d.wt) { const ib = $('#ib'), top = ib.scrollTop; c.wfCol.has(d.wt) ? c.wfCol.delete(d.wt) : c.wfCol.add(d.wt); insp(); ib.scrollTop = top; const f = $(`[data-wt="${CSS.escape(d.wt)}"]`, ib); if (f) f.focus({ preventScroll: true }); return; }
  if (d.tab) { c.tab = d.tab; insp(); }
  else if (d.go) select(d.go, { reveal: true, open: true, force: true, ...tabbed(t) });
  else if (d.nv) { const i = d.nv.indexOf('|'); navPath(d.nv.slice(0, i), d.nv.slice(i + 1)); }
  else if (d.k || d.ol) actC(d.k || d.ol);
  else if (d.act) {
    const a = d.act, o = c.sel && c.N.get(c.sel);
    if (a === 'close') { setPanel(false); }
    else if (a === 'copy') { const x = $('.txt', t.closest('.tb')); if (x) copyText(x.textContent); }
    else if (a === 'grow') { const x = $('.txt', t.closest('.tb')); if (x) { x.classList.toggle('grown'); t.textContent = x.classList.contains('grown') ? 'Collapse' : 'Expand'; } }
    else if (a === 'expandAll' || a === 'collapseAll') $$('#ib details').forEach(x => x.open = a === 'expandAll');
    else if (a === 'raw') { c.raw = !c.raw; insp(); }
    else if (a === 'copyJson' && o) copyText(json(d.which === 'in' ? o.n.input : d.which === 'out' ? o.n.output : o.n.artifacts));
    else if (a === 'copyNode' && o) copyText(json(o.n));
    else if ((a === 'subExp' || a === 'subCol') && o) toggle(o.n.id, { deep: true, collapse: a === 'subCol' });
  }
});
$('#insp').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.wr,.wtg')) { e.preventDefault(); e.target.click(); } });
$('#metaBar').addEventListener('click', e => { if (e.target.closest('[data-issues]')) openSummary('sum-issues'); });
const VW = $('#view'); let drag = null;
VW.addEventListener('pointerdown', e => {
  if (!cur || e.button > 0 || e.target.closest('#zc,#empty,.cv')) return;
  drag = { x: e.clientX, y: e.clientY, vx: cur.v.x, vy: cur.v.y, m: 0, id: e.pointerId, onNode: !!e.target.closest('.nd') };
  // no preventDefault here: it would stop clicks from focusing nodes (breaks keyboard navigation). Selection is blocked by CSS + selectstart/dragstart.
});
VW.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.m && Math.abs(dx) + Math.abs(dy) > 3) {
    drag.m = 1; VW.classList.add('pan');
    try { VW.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
    const sl = getSelection(); if (sl && sl.rangeCount) sl.removeAllRanges();
  }
  if (drag.m) { cur.v.x = drag.vx + dx; cur.v.y = drag.vy + dy; apply(); }
});
const endDrag = e => {
  const d = drag; drag = null; VW.classList.remove('pan');
  if (!d || (e && e.pointerId !== d.id)) return;
  if (d.m) { if (d.onNode) { swallowClick = true; setTimeout(() => swallowClick = false, 0); } }
  else if (!d.onNode && cur && e && e.type === 'pointerup') select(null);
};
let swallowClick = false;
VW.addEventListener('pointerup', endDrag); VW.addEventListener('pointercancel', endDrag); VW.addEventListener('lostpointercapture', () => { if (drag && drag.m) endDrag(); });
VW.addEventListener('click', e => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); swallowClick = false; } }, true);
VW.addEventListener('selectstart', e => { if (drag) e.preventDefault(); });
VW.addEventListener('dragstart', e => e.preventDefault());
VW.addEventListener('wheel', e => { if (!cur) return; e.preventDefault(); const r = VW.getBoundingClientRect(); zoom(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015))); }, { passive: false });
const zc = f => { if (cur) { const r = VW.getBoundingClientRect(); zoom(r.width / 2, r.height / 2, f); } };
$('#zi').onclick = () => zc(1.25); $('#zo').onclick = () => zc(.8); $('#fit').onclick = () => fit();
$('#expAll').onclick = () => setView('expand');
$('#colAll').onclick = () => setView('collapse');
$('#prob').onclick = () => setView('problems');
$('#info').onclick = () => { if (!cur) return; if (ipOpen && !cur.sel) setPanel(false); else openSummary(); };
$('#flow').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; mode = b.dataset.m; $$('#flow button').forEach(x => x.classList.toggle('on', x === b)); if (cur) edges(); };
$('#sel').onchange = e => show(TR[+e.target.value]);
$('#rm').onclick = closeTrace;
for (const b of ['#open', '#open2']) $(b).onclick = () => $('#file').click();
$('#file').onchange = e => { ingest([...e.target.files]); e.target.value = ''; };
$('#find').addEventListener('input', e => setHits(e.target.value));
$('#find').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); stepHit(e.shiftKey ? -1 : 1); }
  else if (e.key === 'Escape') { clearFilter(); e.target.blur(); e.stopPropagation(); }
});
$('#toast').onclick = () => $('#toast').classList.remove('show');
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drop'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drop'); });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drop'); ingest([...e.dataTransfer.files]); });
addEventListener('paste', e => {
  if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const t = (e.clipboardData && e.clipboardData.getData('text') || '').trim();
  if (t[0] === '{') { e.preventDefault(); ingestText(t, `pasted-${TR.length + 1}.json`); }
});
addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey || e.target.closest('#nodes .nd') && ['Enter', ' ', 'ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', '*'].includes(e.key)) return;
  if (e.key === '/') { e.preventDefault(); $('#find').focus(); $('#find').select(); return; }
  if (!cur) return;
  const k = e.key.toLowerCase();
  if (e.key === 'Escape') { if (cur.filtering) clearFilter(); else if (cur.sel) select(null); else if (ipOpen) setPanel(false); }
  else if (k === 'e') setView('expand'); else if (k === 'c') setView('collapse'); else if (k === 'p') setView('problems');
  else if (k === 'f') fit(); else if (k === 's') $('#info').click();
  else if (e.key === '+' || e.key === '=') zc(1.25); else if (e.key === '-') zc(.8);
  else if (e.key === 'n' || e.key === 'N') stepHit(e.shiftKey ? -1 : 1);
  else return;
  e.preventDefault();
});
new ResizeObserver(() => {
  if (!cur) return; const v = VW.getBoundingClientRect();
  if (!cur.vis.some(o => { const x = o.x * cur.v.k + cur.v.x, y = o.y * cur.v.k + cur.v.y; return x < v.width && y < v.height && x + W * cur.v.k > 0 && y + H * cur.v.k > 0; })) fit();
}).observe(VW);
addEventListener('error', e => toast('Unexpected error: ' + e.message, 'er'));
addEventListener('unhandledrejection', e => toast('Unexpected error: ' + (e.reason && e.reason.message || e.reason), 'er'));
insp();
// optional: ?trace=<url> (repeatable) loads traces from the same origin or any CORS-enabled URL
for (const u of new URLSearchParams(location.search).getAll('trace')) fetch(u).then(r => { if (!r.ok) throw Error('HTTP ' + r.status); return r.text(); }).then(t => ingestText(t, u.split('/').pop() || u)).catch(e => toast(`${u}: ${e.message}`, 'er'));
</script>
