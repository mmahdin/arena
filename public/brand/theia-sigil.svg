<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <radialGradient id="ashen" cx="152" cy="104" r="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#586E8B"/>
      <stop offset=".58" stop-color="#3C506B"/>
      <stop offset="1" stop-color="#28384E"/>
    </radialGradient>
    <linearGradient id="cresc" x1="-88" y1="0" x2="-58" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFE"/>
      <stop offset=".6" stop-color="#E4ECF7"/>
